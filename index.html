<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="MADA">
<link rel="apple-touch-icon" href="icon-180.jpg">
<link rel="icon" type="image/jpeg" href="icon-192.jpg">
<link rel="manifest" href="manifest.json">
<meta name="theme-color" content="#2C3B1F">
<title>MADA — Apprendre le malgache</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Anton&family=Work+Sans:ital,wght@0,400;0,500;0,600;0,700;1,500&family=IBM+Plex+Mono:wght@500;600&display=swap" rel="stylesheet">
<style>
  :root{
    --paper:#F2F1DD;
    --paper-light:#FBFBF1;
    --ink:#1F2A17;
    --ink-soft:#55613f;
    --laterite:#C1502E;
    --laterite-dark:#963D22;
    --jade:#3F6B35;
    --jade-dark:#2C4D26;
    --gold:#A7B563;
    --grad-deep:#2C3B1F;
    --grad-mid:#7C9169;
    --grad-light:#E9E8C4;
    --line: rgba(31,42,23,0.14);
    --shadow: 0 10px 30px rgba(31,42,23,0.16);
  }
  *{box-sizing:border-box;}
  html,body{margin:0;padding:0;}
  body{
    background:var(--paper);
    color:var(--ink);
    font-family:'Work Sans', sans-serif;
    min-height:100vh;
    -webkit-font-smoothing:antialiased;
  }
  h1,h2,h3,.display{
    font-family:'Anton', sans-serif;
    font-weight:400;
    letter-spacing:0.01em;
    margin:0;
  }
  .mono{ font-family:'IBM Plex Mono', monospace; letter-spacing:0.02em; }
  button{ font-family:inherit; cursor:pointer; }
  button:focus-visible, .selectable:focus-visible{
    outline:3px solid var(--jade);
    outline-offset:2px;
  }

  .lamba-band{
    height:16px;
    width:100%;
    background: radial-gradient(circle at 15% 90%, var(--grad-light) 0%, var(--grad-mid) 45%, var(--grad-deep) 85%);
  }
  .lamba-band.thin{ height:8px; }

  #app{ max-width:720px; margin:0 auto; padding-bottom:60px; }
  .container{ padding:28px 20px 0; }

  .home-header{ text-align:center; padding:8px 0 6px; }
  .eyebrow{
    display:inline-block; font-family:'IBM Plex Mono', monospace; font-size:12px;
    letter-spacing:0.14em; text-transform:uppercase; color:var(--jade-dark);
    background:rgba(63,107,53,0.1); padding:4px 10px; border-radius:100px; margin-bottom:14px;
  }
  .hero-card{
    background: radial-gradient(circle at 20% 88%, var(--grad-light) 0%, var(--grad-mid) 45%, var(--grad-deep) 92%);
    border-radius:24px; padding:44px 20px 38px; box-shadow:var(--shadow); position:relative; overflow:hidden;
  }
  .hero-title{ font-size:64px; color:#fff; letter-spacing:0.02em; line-height:0.95; }
  .hero-sub{ font-family:'IBM Plex Mono',monospace; font-size:11.5px; letter-spacing:.2em; text-transform:uppercase; color:rgba(255,255,255,0.75); margin-top:10px; }
  .version-tag{ text-align:center; font-size:10.5px; color:var(--ink-soft); opacity:0.55; margin-top:8px; }
  .home-header p{ color:var(--ink-soft); font-size:15px; margin-top:18px; max-width:44ch; margin-left:auto; margin-right:auto; }

  .xp-row{ display:flex; align-items:center; justify-content:center; gap:8px; margin-top:18px; flex-wrap:wrap; }
  .xp-pill{ font-family:'IBM Plex Mono',monospace; font-size:12px; background:var(--ink); color:var(--paper-light); padding:6px 13px; border-radius:100px; }
  .xp-pill.rank{ background:var(--jade); }
  .badges-row{ display:flex; gap:10px; justify-content:center; margin-top:16px; flex-wrap:wrap; }
  .badge{ width:42px; height:42px; border-radius:11px; display:flex; align-items:center; justify-content:center; font-size:19px; background:var(--paper-light); border:1.5px solid var(--line); }
  .badge.locked{ opacity:0.28; filter:grayscale(1); }

  .levels{ display:flex; flex-direction:column; gap:14px; margin-top:22px; }
  .level-card{
    background:var(--paper-light); border:1px solid var(--line); border-radius:16px;
    padding:0; overflow:hidden; text-align:left; box-shadow:var(--shadow);
    transition:transform .15s ease; width:100%;
  }
  .level-card:active{ transform:scale(0.985); }
  .level-card-inner{ padding:18px 20px 20px; display:flex; flex-direction:column; gap:6px; }
  .level-top-row{ display:flex; align-items:baseline; justify-content:space-between; gap:10px;}
  .level-name{ font-size:22px; }
  .level-tag{ font-size:11px; text-transform:uppercase; letter-spacing:.1em; color:var(--ink-soft); }
  .level-desc{ font-size:14px; color:var(--ink-soft); line-height:1.5; }
  .level-progress{ display:flex; align-items:center; gap:8px; margin-top:8px; font-size:13px; color:var(--ink-soft);}

  .info-toggle{ margin-top:26px; border:1px dashed var(--line); border-radius:14px; padding:14px 16px; background:transparent; }
  .info-toggle summary{ font-size:14px; font-weight:600; cursor:pointer; color:var(--jade); list-style:none;}
  .info-toggle summary::-webkit-details-marker{ display:none; }
  .info-toggle summary:before{ content:"◆ "; color:var(--laterite); }
  .info-toggle p{ font-size:13.5px; color:var(--ink-soft); line-height:1.6; margin:10px 0 0; }

  .topbar{ display:flex; align-items:center; gap:12px; padding:18px 20px 0; }
  .back-btn{
    background:none; border:none; font-size:20px; color:var(--ink);
    width:36px; height:36px; border-radius:100px; display:flex; align-items:center; justify-content:center;
    border:1px solid var(--line); flex-shrink:0;
  }
  .topbar h2{ font-size:20px; }
  .topbar .sub{ font-size:12px; color:var(--laterite); font-family:'IBM Plex Mono',monospace; text-transform:uppercase; letter-spacing:.08em;}

  .chapters{ display:grid; grid-template-columns:1fr 1fr; gap:12px; margin-top:20px; padding:0 20px; }
  .chapter-card{
    background:var(--paper-light); border:1px solid var(--line); border-radius:14px;
    padding:16px 14px; text-align:left; box-shadow:var(--shadow);
  }
  .chapter-card:active{ transform:scale(0.97); }
  .chapter-emoji{ font-size:26px; }
  .chapter-step{ font-size:11px; color:var(--ink-soft); font-family:'IBM Plex Mono',monospace; margin-top:8px; }
  .chapter-title{ font-size:16px; margin-top:2px; font-family:'Anton', sans-serif; font-weight:400; letter-spacing:.01em; }
  .chapter-sub{ font-size:12.5px; color:var(--ink-soft); margin-top:2px; }
  .chapter-stars{ margin-top:10px; font-size:13px; }
  .stars{ letter-spacing:2px; color:var(--gold); }

  .revision-entry{ margin:20px 20px 0; background:var(--ink); color:var(--paper-light); border-radius:16px; overflow:hidden; text-align:left; box-shadow:var(--shadow); width:calc(100% - 40px); }
  .revision-entry-inner{ padding:18px 20px 20px; display:flex; align-items:center; gap:16px; }
  .revision-entry-emoji{ font-size:34px; }
  .revision-entry-tag{ font-family:'IBM Plex Mono',monospace; font-size:11px; letter-spacing:.1em; text-transform:uppercase; color:var(--gold); }
  .revision-entry-title{ font-family:'Anton', sans-serif; letter-spacing:.01em; font-size:19px; margin-top:3px; }
  .revision-entry-desc{ font-size:12.5px; color:#cabfa4; margin-top:5px; line-height:1.45;}

  .srs-entry{ margin:22px 20px 0; background:var(--jade); color:var(--paper-light); border-radius:16px; overflow:hidden; text-align:left; box-shadow:var(--shadow); width:calc(100% - 40px); border:none; }
  .srs-entry-inner{ padding:18px 20px 20px; display:flex; align-items:center; gap:16px; }
  .srs-entry-emoji{ font-size:34px; }
  .srs-entry-tag{ font-family:'IBM Plex Mono',monospace; font-size:11px; letter-spacing:.1em; text-transform:uppercase; color:#d8f0e8; }
  .srs-entry-title{ font-family:'Anton', sans-serif; letter-spacing:.01em; font-size:19px; margin-top:3px; }
  .srs-entry-desc{ font-size:12.5px; color:#cdeadf; margin-top:5px; line-height:1.45;}
  .srs-entry-count{ font-family:'IBM Plex Mono',monospace; font-size:12px; margin-top:8px; background:rgba(0,0,0,0.18); display:inline-block; padding:3px 10px; border-radius:100px;}

  .nav-tiles{ display:flex; flex-direction:column; gap:12px; margin-top:24px; }
  .nav-tile{
    background:var(--paper-light); border:1px solid var(--line); border-radius:16px;
    padding:18px 18px; text-align:left; box-shadow:var(--shadow);
    display:flex; align-items:center; gap:14px; width:100%;
  }
  .nav-tile:active{ transform:scale(0.98); }
  .nav-tile-emoji{ font-size:30px; flex-shrink:0; }
  .nav-tile-body{ flex:1; }
  .nav-tile-title{ font-family:'Anton',sans-serif; font-size:19px; letter-spacing:.01em; }
  .nav-tile-desc{ font-size:12.5px; color:var(--ink-soft); margin-top:3px; line-height:1.4; }
  .nav-tile-arrow{ font-size:20px; color:var(--jade); flex-shrink:0; }

  .cards-wrap{ padding:20px 20px 0; display:flex; flex-direction:column; align-items:center; }
  .cards-progress{ font-family:'IBM Plex Mono',monospace; font-size:12.5px; color:var(--ink-soft); margin-bottom:14px; }
  .card-stack{ position:relative; width:100%; max-width:320px; height:400px; touch-action:none; }
  .swipe-card{
    position:absolute; inset:0; background:var(--paper-light); border-radius:20px; box-shadow:var(--shadow);
    display:flex; flex-direction:column; align-items:center; justify-content:center; text-align:center;
    padding:30px 22px; user-select:none; cursor:grab; border:1px solid var(--line); touch-action:none;
  }
  .swipe-card.behind{ transform:scale(0.94) translateY(10px); z-index:1; }
  .swipe-card.front{ z-index:2; }
  .swipe-card-kicker{ font-family:'IBM Plex Mono',monospace; font-size:11px; text-transform:uppercase; letter-spacing:.14em; color:var(--jade); }
  .swipe-card-mg{ font-family:'Anton',sans-serif; font-size:30px; margin-top:14px; line-height:1.15; }
  .swipe-card-fr{ font-size:15px; color:var(--ink-soft); margin-top:10px; }
  .swipe-card-tip{ margin-top:20px; background:rgba(63,107,53,0.08); border-radius:12px; padding:12px 14px; font-size:12.5px; color:var(--ink-soft); line-height:1.5; }
  .swipe-card-tip b{ color:var(--jade); }
  .swipe-stamp{
    position:absolute; top:24px; font-family:'Anton',sans-serif; font-size:22px; letter-spacing:.05em;
    padding:6px 14px; border-radius:8px; border:3px solid; opacity:0; transform:rotate(-12deg);
  }
  .swipe-stamp.left{ left:20px; color:var(--laterite); border-color:var(--laterite); }
  .swipe-stamp.right{ right:20px; color:var(--jade); border-color:var(--jade); transform:rotate(12deg); }
  .cards-hint{ text-align:center; font-size:12.5px; color:var(--ink-soft); margin-top:18px; }
  .cards-buttons{ display:flex; gap:16px; margin-top:20px; }
  .cards-btn{ width:56px; height:56px; border-radius:100px; border:1.5px solid var(--line); background:var(--paper-light); font-size:24px; box-shadow:var(--shadow); }
  .cards-btn:active{ transform:scale(0.94); }
  .cards-btn.left{ color:var(--laterite); }
  .cards-btn.right{ color:var(--jade); }

  .maki-entry{ margin:12px 20px 0; background:linear-gradient(135deg, var(--grad-mid), var(--grad-deep)); color:#fff; border-radius:16px; padding:16px 18px; text-align:left; box-shadow:var(--shadow); width:calc(100% - 40px); border:none; display:flex; align-items:center; gap:14px; }
  .maki-entry:active{ transform:scale(0.98); }
  .maki-entry-emoji{ font-size:32px; flex-shrink:0; }
  .maki-entry-title{ font-family:'Anton',sans-serif; font-size:18px; letter-spacing:.01em; }
  .maki-entry-desc{ font-size:12.5px; color:rgba(255,255,255,0.85); margin-top:4px; line-height:1.4; }
  .maki-entry-best{ font-family:'IBM Plex Mono',monospace; font-size:11.5px; margin-top:7px; opacity:0.9; }

  .maki-wrap{ padding:20px 20px 0; display:flex; justify-content:center; }
  .maki-canvas-shell{ position:relative; width:100%; max-width:340px; border-radius:16px; overflow:hidden; box-shadow:var(--shadow); touch-action:none; }
  .maki-canvas-shell canvas{ width:100%; height:auto; display:block; touch-action:none; }
  .maki-overlay{
    position:absolute; inset:0; background:rgba(31,42,23,0.82); color:#fff;
    display:flex; flex-direction:column; align-items:center; justify-content:center;
    text-align:center; padding:26px 22px; gap:10px;
  }
  .maki-overlay-title{ font-family:'Anton',sans-serif; font-size:26px; letter-spacing:.02em; }
  .maki-overlay-text{ font-family:'IBM Plex Mono',monospace; font-size:12.5px; opacity:0.9; line-height:1.6; }
  .maki-question{ width:100%; margin-top:4px; }
  .maki-question-prompt{ font-family:'Anton',sans-serif; font-size:19px; margin-bottom:10px; }
  .maki-question-options{ display:grid; grid-template-columns:1fr 1fr; gap:8px; }
  .maki-overlay .btn-primary{ margin-top:6px; width:100%; }

  .mode-grid{ display:flex; flex-direction:column; gap:12px; margin-top:20px; padding:0 20px; }
  .mode-card{ background:var(--paper-light); border:1px solid var(--line); border-radius:14px; padding:16px; text-align:left; box-shadow:var(--shadow); display:flex; gap:14px; align-items:center; width:100%; }
  .mode-card:active{ transform:scale(0.98); }
  .mode-emoji{ font-size:28px; flex-shrink:0; }
  .mode-name{ font-family:'Anton', sans-serif; font-weight:400; letter-spacing:.01em; font-size:16px; }
  .mode-desc{ font-size:12.5px; color:var(--ink-soft); margin-top:2px; }
  .mode-best{ font-size:12px; color:var(--jade); margin-top:6px; font-family:'IBM Plex Mono',monospace; }

  .progress-track{ height:8px; border-radius:100px; background:rgba(42,32,21,0.1); margin:18px 20px 0; overflow:hidden; }
  .progress-fill{ height:100%; background:var(--jade); border-radius:100px; transition:width .35s ease; }

  .quiz-wrap{ padding:28px 20px 0; }
  .prompt-card{
    background:var(--paper-light); border:1px solid var(--line); border-radius:20px;
    padding:34px 24px; text-align:center; box-shadow:var(--shadow); position:relative;
  }
  .prompt-kicker{ font-size:11.5px; text-transform:uppercase; letter-spacing:.12em; color:var(--jade); font-family:'IBM Plex Mono',monospace; margin-bottom:14px; }
  .prompt-word{ font-size:30px; line-height:1.25; font-family:'Anton', sans-serif; font-weight:400; letter-spacing:.015em; }

  .options{ display:grid; grid-template-columns:1fr 1fr; gap:12px; margin-top:22px; }
  .option-btn{
    background:var(--paper-light); border:1.5px solid var(--line); border-radius:14px;
    padding:14px 12px; font-size:14.5px; text-align:left; line-height:1.35; color:var(--ink);
    transition:all .12s ease;
  }
  .option-btn:not(:disabled):active{ transform:scale(0.97); }
  .option-btn.correct{ background:var(--jade); border-color:var(--jade); color:#fff; }
  .option-btn.wrong{ background:var(--laterite); border-color:var(--laterite); color:#fff; }
  .option-btn.dim{ opacity:0.45; }

  .next-btn{ margin-top:20px; width:100%; background:var(--ink); color:var(--paper-light); border:none; border-radius:100px; padding:15px; font-size:15px; font-weight:600; }
  .next-btn:active{ transform:scale(0.98); }

  .match-grid{ display:flex; gap:14px; margin-top:8px; }
  .match-col{ flex:1; display:flex; flex-direction:column; gap:10px; }
  .match-card{
    background:var(--paper-light); border:1.5px solid var(--line); border-radius:12px;
    padding:12px 10px; font-size:13.5px; text-align:center; min-height:52px;
    display:flex; align-items:center; justify-content:center; line-height:1.3;
  }
  .match-card.selected{ border-color:var(--jade); background:rgba(31,92,78,0.08); }
  .match-card.matched{ background:var(--jade); border-color:var(--jade); color:#fff; opacity:0.55; }
  .match-card.wrong{ background:var(--laterite); border-color:var(--laterite); color:#fff; }
  .match-hint{ text-align:center; font-size:13px; color:var(--ink-soft); margin-top:16px; }

  .timer-track{ height:6px; border-radius:100px; background:rgba(42,32,21,0.12); margin-top:18px; overflow:hidden; }
  .timer-fill{ height:100%; background:var(--jade); border-radius:100px; }
  .combo-row{ display:flex; justify-content:center; gap:18px; margin-top:14px; font-family:'IBM Plex Mono',monospace; font-size:13px; color:var(--ink-soft); }
  .combo-flame{ color:var(--laterite); font-weight:600; }
  .hearts-row{ text-align:center; font-size:22px; letter-spacing:8px; margin-top:8px; }
  .score-row{ text-align:center; font-family:'IBM Plex Mono',monospace; font-size:13px; color:var(--ink-soft); margin-top:6px;}

  .tf-options{ display:flex; gap:14px; margin-top:26px; }
  .tf-btn{ flex:1; border-radius:16px; border:1.5px solid var(--line); background:var(--paper-light); padding:22px; font-size:30px; text-align:center; }
  .tf-btn:active{ transform:scale(0.97); }
  .tf-btn.correct{ background:var(--jade); border-color:var(--jade); color:#fff; }
  .tf-btn.wrong{ background:var(--laterite); border-color:var(--laterite); color:#fff; }
  .tf-btn.dim{ opacity:.45; }

  .result-wrap{ padding:38px 20px 0; text-align:center; }
  .result-stars{ font-size:44px; letter-spacing:6px; color:var(--gold); margin:16px 0 6px; }
  .result-score{ font-family:'IBM Plex Mono',monospace; font-size:15px; color:var(--ink-soft); }
  .result-note{
    margin-top:22px; background:var(--paper-light); border:1px solid var(--line); border-radius:14px;
    padding:16px 18px; font-size:14px; color:var(--ink-soft); text-align:left; line-height:1.55;
  }
  .result-actions{ display:flex; flex-direction:column; gap:10px; margin-top:26px; }
  .btn-primary{ background:var(--jade); color:#fff; border:none; border-radius:100px; padding:15px; font-size:15px; font-weight:600; }
  .btn-secondary{ background:none; border:1.5px solid var(--line); color:var(--ink); border-radius:100px; padding:14px; font-size:15px; font-weight:600; }
  .btn-primary:active,.btn-secondary:active{ transform:scale(0.98); }

  .new-badges{ margin-top:22px; }
  .new-badges-title{ font-size:12px; text-transform:uppercase; letter-spacing:.1em; color:var(--ink-soft); font-family:'IBM Plex Mono',monospace; }

  .proverb-card{
    background:var(--ink); color:var(--paper-light); border-radius:16px; padding:22px 20px; margin-top:6px;
    position:relative; overflow:hidden; text-align:left;
  }
  .proverb-mg{ font-family:'Work Sans', sans-serif; font-size:17px; font-style:italic; font-weight:500; line-height:1.4; }
  .proverb-fr{ margin-top:10px; font-size:13.5px; color:#c9bfa6; }

  @media (min-width:600px){ .chapters{ grid-template-columns:1fr 1fr; } }
</style>
</head>
<body>
<div class="lamba-band"></div>
<div id="app"></div>

<script>
const LEVELS = [
  {
    id:'mpanomboka', name:'Mpanomboka', tag:'Niveau 0 — Débutant',
    desc:'Les fondations : se saluer, compter, nommer les couleurs et la famille.',
    chapters:[
      { id:'salutations', title:'Fiarahabana', sub:'Salutations', emoji:'👋', words:[
        {mg:'Salama', fr:'Bonjour / Salut', tip:'Pense à saluer « ma sala(ma) » d’un geste de la main.'},
        {mg:'Manao ahoana', fr:'Comment ça va ?', tip:'« Manao ahoana » ~ imagine qu’on te demande « m’as-tu ah non… ça va ? »'},
        {mg:'Tsara fa misaotra', fr:'Bien, merci', tip:'« Tsara » sonne comme « trésor » : se sentir bien, c’est précieux.'},
        {mg:'Veloma', fr:'Au revoir', tip:'« Veloma » ~ « vélo, ma ! » — pars à vélo en disant au revoir.'},
        {mg:'Misaotra', fr:'Merci', tip:'« Misaotra » ~ « mise au trot » : dis merci et repars au trot.'},
        {mg:'Azafady', fr:'Pardon / S’il te plaît', tip:'Un « fady » est un tabou malgache : « azafady » l’excuse poliment.'},
        {mg:'Eny', fr:'Oui', tip:'Court comme un hochement de tête franc : « eny », oui.'},
        {mg:'Tsia', fr:'Non', tip:'« Tsia » ~ le petit « tss » sec de désapprobation.'},
      ]},
      { id:'nombres', title:'Isa', sub:'Nombres de 1 à 10', emoji:'🔢', words:[
        {mg:'iray', fr:'un', tip:'« iray » ~ « un rail » : un seul chemin, un seul rail.'},
        {mg:'roa', fr:'deux', tip:'« roa » ~ « roue » : deux roues à l’avant d’une voiture.'},
        {mg:'telo', fr:'trois', tip:'« telo » ~ « trio » : trois amis inséparables.'},
        {mg:'efatra', fr:'quatre', tip:'« efatra » ~ « et quatre ! » comme un compte au judo.'},
        {mg:'dimy', fr:'cinq', tip:'« dimy » ~ « dis-moi » les cinq doigts de la main.'},
        {mg:'enina', fr:'six', tip:'« enina » ~ « et Nina » a six ans.'},
        {mg:'fito', fr:'sept', tip:'« fito » ~ « fit au » bout de sept jours.'},
        {mg:'valo', fr:'huit', tip:'« valo » ~ on danse la « valse » à huit.'},
        {mg:'sivy', fr:'neuf', tip:'« sivy » ~ « si vie » a neuf vies, comme le chat.'},
        {mg:'folo', fr:'dix', tip:'« folo » ~ une « foule » de dix personnes.'},

async function loadProgress(){
  try{
    const raw = localStorage.getItem('malagasy-progress');
    if(raw){
      const parsed = JSON.parse(raw);
      if(parsed && parsed.chapters){
        progress = freshProgress();
        progress.chapters = parsed.chapters || {};
        progress.xp = parsed.xp || 0;
        progress.revision = Object.assign(freshProgress().revision, parsed.revision || {});
        progress.srs = parsed.srs || {};
        progress.srsSessionsCompleted = parsed.srsSessionsCompleted || 0;
        progress.streak = parsed.streak || { count:0, lastDate:null };
        progress.miniGame = parsed.miniGame || { best:0 };
        progress.cardsLearned = parsed.cardsLearned || 0;
      } else if(parsed && typeof parsed === 'object'){
        progress = freshProgress();
        progress.chapters = parsed;
      }
    }
  }catch(e){ progress = freshProgress(); }
  updateStreak();
  render();
}
async function saveProgress(){
  try{ localStorage.setItem('malagasy-progress', JSON.stringify(progress)); }
  catch(e){ /* ignore */ }
}

function todayStr(){
  const d = new Date();
  return `${d.getFullYear()}-${String(d.getMonth()+1).padStart(2,'0')}-${String(d.getDate()).padStart(2,'0')}`;
}
function updateStreak(){
  if(!progress.streak) progress.streak = { count:0, lastDate:null };
  const today = todayStr();
  const last = progress.streak.lastDate;
  if(last === today){ return; } // déjà compté aujourd'hui
  if(!last){
    progress.streak.count = 1;
  } else {
    const yesterday = new Date(Date.now() - 86400000);
    const yStr = `${yesterday.getFullYear()}-${String(yesterday.getMonth()+1).padStart(2,'0')}-${String(yesterday.getDate()).padStart(2,'0')}`;
    progress.streak.count = (last === yStr) ? progress.streak.count + 1 : 1;
  }
  progress.streak.lastDate = today;
  saveProgress();
}

function shuffle(arr){ return arr.map(v=>[Math.random(),v]).sort((a,b)=>a[0]-b[0]).map(v=>v[1]); }
function starsString(n){ return '★★★'.slice(0, n) + '☆☆☆'.slice(0, 3-n); }
function findLevel(id){ return LEVELS.find(l=>l.id===id); }
function findChapter(level, chId){ return level.chapters.find(c=>c.id===chId); }
function combinedPool(level){ return level.chapters.flatMap(c=>c.words); }
function currentRank(xp){ let r = RANKS[0]; for(const rk of RANKS){ if(xp >= rk.min) r = rk; } return r; }

function makeQCM(word, pool, direction){
  const prompt = direction === 'mg2fr' ? word.mg : word.fr;
  const correct = direction === 'mg2fr' ? word.fr : word.mg;
  let distractors = pool.filter(x=>x!==word).map(x=> direction==='mg2fr' ? x.fr : x.mg);
  distractors = shuffle(distractors).slice(0,3);
  const options = shuffle([correct, ...distractors]);
  return { type:'qcm', direction, prompt, correct, options };
}

function buildQuestions(chapter){
  const words = chapter.words;
  const qcm = words.map((w,i)=> makeQCM(w, words, i % 2 === 0 ? 'mg2fr' : 'fr2mg'));
  const matchWords = shuffle(words).slice(0, Math.min(6, words.length));
  return { qcm: shuffle(qcm), match: matchWords };
}

/* ======================= SRS (répétition espacée, SM-2 simplifié) ======================= */
function allWords(){
  return LEVELS.flatMap(l => l.chapters.flatMap(c => c.words.map(w => ({
    mg: w.mg, fr: w.fr, tip: w.tip || '', key: c.id + '::' + w.mg, levelId: l.id
  }))));
}
function srsDueList(now){
  return allWords().filter(w=>{
    const c = progress.srs[w.key];
    return c && c.due <= now;
  }).sort((a,b)=> progress.srs[a.key].due - progress.srs[b.key].due);
}
function srsNewList(){
  return allWords().filter(w => !progress.srs[w.key]);
}
function srsNextDue(now){
  const upcoming = allWords()
    .map(w=>progress.srs[w.key])
    .filter(c=>c && c.due > now)
    .sort((a,b)=>a.due-b.due);
  return upcoming.length ? upcoming[0].due : null;
}
function humanDelay(ms){
  if(ms < 3600000) return `${Math.max(1, Math.round(ms/60000))} min`;
  if(ms < 86400000) return `${Math.round(ms/3600000)} h`;
  return `${Math.round(ms/86400000)} j`;
}
function buildSrsQueue(){
  const now = Date.now();
  const due = srsDueList(now).slice(0, 20);
  const remaining = Math.max(0, 20 - due.length);
  const fresh = shuffle(srsNewList()).slice(0, Math.min(10, remaining));
  return [...shuffle(due), ...shuffle(fresh)].map(w=>w.key);
}
function srsRecordAnswer(key, correct){
  const now = Date.now();
  let card = progress.srs[key];
  if(!card) card = { ef:2.5, interval:0, reps:0, due: now };
  if(correct){
    card.reps++;
    if(card.reps === 1) card.interval = 1;
    else if(card.reps === 2) card.interval = 6;
    else card.interval = Math.round(card.interval * card.ef);
    card.ef = Math.min(2.8, card.ef + 0.05);
    card.due = now + card.interval * 86400000;
  } else {
    card.reps = 0;
    card.ef = Math.max(1.3, card.ef - 0.2);
    card.interval = 0;
    card.due = now;
  }
  progress.srs[key] = card;
}

function srsHomeStatus(){
  const now = Date.now();
  const due = srsDueList(now).length;
  const fresh = srsNewList().length;
  if(due > 0) return `${due} mot${due>1?'s':''} à réviser aujourd’hui`;
  if(fresh > 0) return `${fresh} nouveau${fresh>1?'x':''} mot${fresh>1?'s':''} à découvrir`;
  const next = srsNextDue(now);
  return next ? `Tout est à jour · prochaine dans ${humanDelay(next-now)}` : 'Tout est à jour';
}

function handleMatchClick(card, q){
  const ms = quizState.matchState;
  const side = card.dataset.side;
  if(card.classList.contains('matched')) return;

  if(side === 'mg'){
    document.querySelectorAll('[data-side="mg"]').forEach(c=>c.classList.remove('selected'));
    card.classList.add('selected');
    ms.selectedMg = { key: card.dataset.key, el: card };
  } else {
    document.querySelectorAll('[data-side="fr"]').forEach(c=>c.classList.remove('selected'));
    card.classList.add('selected');
    ms.selectedFr = { key: card.dataset.key, el: card };
  }

  if(ms.selectedMg && ms.selectedFr){
    const isMatch = ms.selectedMg.key === ms.selectedFr.key;
    if(isMatch){
      ms.selectedMg.el.classList.remove('selected');
      ms.selectedFr.el.classList.remove('selected');
      ms.selectedMg.el.classList.add('matched');
      ms.selectedFr.el.classList.add('matched');
      ms.matched.add(ms.selectedMg.key);
      ms.selectedMg = null; ms.selectedFr = null;
      if(ms.matched.size === ms.total){
        quizState.correct += Math.max(0, ms.total - ms.mistakes) >= ms.total - 1 ? 1 : 0.5;
        setTimeout(advanceQuiz, 550);
      }
    } else {
      ms.mistakes++;
      const a = ms.selectedMg.el, b = ms.selectedFr.el;
      a.classList.add('wrong'); b.classList.add('wrong');
      setTimeout(()=>{ a.classList.remove('wrong','selected'); b.classList.remove('wrong','selected'); }, 420);
      ms.selectedMg = null; ms.selectedFr = null;
    }
  }
}

function advanceQuiz(){
  quizState.index++;
  if(quizState.index >= quizState.queue.length){ finishQuiz(); } else { render(); }
}

function finishQuiz(){
  const {chapter} = currentLevelAndChapter();
  const maxPoints = quizState.total + 1;
  const pct = quizState.correct / maxPoints;
  let stars = 0;
  if(pct >= 0.85) stars = 3; else if(pct >= 0.6) stars = 2; else if(pct > 0) stars = 1;

  const prevBadges = unlockedBadgeIds(progress);
  const prevBest = progress.chapters[chapter.id] || 0;
  if(stars > prevBest) progress.chapters[chapter.id] = stars;

  const matchXP = quizState.matchState ? Math.max(5, 15 - quizState.matchState.mistakes*3) : 0;
  const xpGained = quizState.qcmCorrectCount * 10 + matchXP;
  progress.xp += xpGained;
  const newBadges = badgeDiff(prevBadges, progress);
  saveProgress();

  screen = { name:'result', stars, correct: quizState.correct, max: maxPoints, chapterId: chapter.id, xpGained, newBadges };
  render();
}

function startRevisionMode(level, mode){
  const pool = combinedPool(level);
  if(mode === 'cards'){
    const deck = shuffle(pool).map(w=>({ mg:w.mg, fr:w.fr, tip:w.tip||'', misses:0 }));
    revState = { levelId:level.id, mode:'cards', deck, learned:0, seenTotal:0 };
    screen = { name:'rev-cards' };
  } else if(mode === 'speed'){
    const n = Math.min(12, pool.length);
    const chosen = shuffle(pool).slice(0, n);
    const questions = chosen.map((w,i)=> makeQCM(w, pool, i%2===0 ? 'mg2fr' : 'fr2mg'));
    revState = { levelId:level.id, mode:'speed', questions, index:0, correct:0, combo:0, bestCombo:0, xp:0 };
    screen = { name:'rev-speed' };
  } else if(mode === 'truefalse'){
    const n = Math.min(10, pool.length);
    const chosen = shuffle(pool).slice(0, n);
    const rounds = chosen.map(w=>{
      const isTrue = Math.random() < 0.5;
      let shown;
      if(isTrue){ shown = w.fr; }
      else { const others = pool.filter(x=>x!==w).map(x=>x.fr); shown = shuffle(others)[0] || w.fr; }
      return { mg:w.mg, shown, isTrue: shown === w.fr };
    });
    revState = { levelId:level.id, mode:'truefalse', rounds, index:0, correct:0, combo:0, bestCombo:0 };
    screen = { name:'rev-truefalse' };
  } else if(mode === 'survival'){
    revState = { levelId:level.id, mode:'survival', pool, hearts:3, correct:0, current:null };
    revState.current = makeQCM(pool[Math.floor(Math.random()*pool.length)], pool, Math.random()<0.5?'mg2fr':'fr2mg');
    screen = { name:'rev-survival' };
  } else if(mode === 'memory'){
    const n = Math.min(8, pool.length);
    const chosen = shuffle(pool).slice(0, n);
    revState = { levelId:level.id, mode:'memory', words: chosen, mistakes:0, matched:new Set(), selectedMg:null, selectedFr:null };
    screen = { name:'rev-memory' };
  }
  render();
}

function handleMemoryClick(card){
  const st = revState;
  if(card.classList.contains('matched')) return;
  const side = card.dataset.side;

  if(side === 'mg'){
    document.querySelectorAll('[data-side="mg"]').forEach(c=>c.classList.remove('selected'));
    card.classList.add('selected');
    st.selectedMg = { key: card.dataset.key, el: card };
  } else {
    document.querySelectorAll('[data-side="fr"]').forEach(c=>c.classList.remove('selected'));
    card.classList.add('selected');
    st.selectedFr = { key: card.dataset.key, el: card };
  }

  if(st.selectedMg && st.selectedFr){
    const isMatch = st.selectedMg.key === st.selectedFr.key;
    if(isMatch){
      st.selectedMg.el.classList.remove('selected');
      st.selectedFr.el.classList.remove('selected');
      st.selectedMg.el.classList.add('matched');
      st.selectedFr.el.classList.add('matched');
      st.matched.add(st.selectedMg.key);
      st.selectedMg = null; st.selectedFr = null;
      if(st.matched.size === st.words.length){ setTimeout(finishRevMemory, 500); }
    } else {
      st.mistakes++;
      const a = st.selectedMg.el, b = st.selectedFr.el;
      a.classList.add('wrong'); b.classList.add('wrong');
      setTimeout(()=>{
        a.classList.remove('wrong','selected');
        b.classList.remove('wrong','selected');
        const scoreEl = document.querySelector('.score-row');
        if(scoreEl) scoreEl.textContent = `Erreurs : ${st.mistakes}`;
      }, 420);
      st.selectedMg = null; st.selectedFr = null;
    }
  }
}

function finishRevMemory(){

  if(progress.revision.memory.bestMistakes === null || st.mistakes < progress.revision.memory.bestMistakes){

  const xp = Math.max(5, 20 - st.mistakes * 2);

  saveProgress();
  screen = { name:'rev-result', mode:'memory', levelId: st.levelId, stats:{mistakes: st.mistakes, xp}, newBadges };
  render();
}

function renderRevCards(){

          </div>
        ` : ''}
        <div class="swipe-card front" id="frontCard">
          <div class="swipe-stamp left" id="stampLeft">REVOIR</div>
          <div class="swipe-stamp right" id="stampRight">APPRIS</div>
          <div class="swipe-card-kicker">Malagasy</div>

          ${front.tip ? `<div class="swipe-card-tip"><b>Astuce</b> · ${front.tip}</div>` : ''}
        </div>
      </div>
      <div class="cards-buttons">
        <button class="cards-btn left selectable" id="btnLeft">✕</button>
        <button class="cards-btn right selectable" id="btnRight">✓</button>
      </div>
      <div class="cards-hint">Swipe la carte, ou utilise les boutons — à gauche si tu ne le retiens pas encore, à droite si c’est appris.</div>
    </div>
  `;
  document.getElementById('backHub').addEventListener('click', ()=>{ screen={name:'revision-hub', levelId:level.id}; render(); });

  const frontCard = document.getElementById('frontCard');
  const stampLeft = document.getElementById('stampLeft');
  const stampRight = document.getElementById('stampRight');
  let dragging = false, startX = 0, startY = 0, dx = 0, locked = false;

  function resolveSwipe(direction){
    if(locked) return;
    locked = true;
    const word = st.deck.shift();
    st.seenTotal++;
    if(direction === 'right'){
      st.learned++;
      progress.cardsLearned = (progress.cardsLearned||0) + 1;
    } else {
      word.misses++;
      const reinsertAt = Math.min(st.deck.length, 2 + Math.floor(Math.random()*3));
      st.deck.splice(reinsertAt, 0, word);
    }
    saveProgress();
    const flyX = direction === 'right' ? 500 : -500;
    frontCard.style.transition = 'transform .35s ease, opacity .35s ease';
    frontCard.style.transform = `translateX(${flyX}px) rotate(${direction==='right'?18:-18}deg)`;
    frontCard.style.opacity = '0';
    setTimeout(()=>{ render(); }, 260);
  }

  function onStart(clientX, clientY){
    if(locked) return;
    dragging = true; startX = clientX; startY = clientY; dx = 0;
    frontCard.style.transition = 'none';
    frontCard.style.cursor = 'grabbing';
  }
  function onMove(clientX, clientY){
    if(!dragging) return;
    dx = clientX - startX;
    const rot = dx / 18;
    frontCard.style.transform = `translateX(${dx}px) rotate(${rot}deg)`;
    const op = Math.min(1, Math.abs(dx)/80);
    if(dx > 0){ stampRight.style.opacity = op; stampLeft.style.opacity = 0; }
    else { stampLeft.style.opacity = op; stampRight.style.opacity = 0; }
  }
  function onEnd(){
    if(!dragging) return;
    dragging = false;
    frontCard.style.cursor = 'grab';
    if(dx > 90){ resolveSwipe('right'); }
    else if(dx < -90){ resolveSwipe('left'); }
    else {
      frontCard.style.transition = 'transform .25s ease';
      frontCard.style.transform = 'translateX(0) rotate(0)';
      stampLeft.style.opacity = 0; stampRight.style.opacity = 0;
    }
  }

  frontCard.addEventListener('pointerdown', (e)=>{
    frontCard.setPointerCapture(e.pointerId);
    onStart(e.clientX, e.clientY);
  });
  frontCard.addEventListener('pointermove', (e)=>{ onMove(e.clientX, e.clientY); });
  frontCard.addEventListener('pointerup', onEnd);
  frontCard.addEventListener('pointercancel', onEnd);

  document.getElementById('btnLeft').addEventListener('click', ()=> resolveSwipe('left'));
  document.getElementById('btnRight').addEventListener('click', ()=> resolveSwipe('right'));
}

/* ======================= Mini-jeu : Saut de Maki (Flappy + vocabulaire) ======================= */
function renderMakiGame(){
  clearActiveInterval();
  app.innerHTML = `
    <div class="topbar">
      <button class="back-btn" id="backHome">✕</button>
      <div>
        <div class="sub mono">Mini-jeu</div>
        <h2 style="font-size:17px;">🦎 Saut de Maki</h2>
      </div>
    </div>
    <div class="maki-wrap">
      <div class="maki-canvas-shell">
        <canvas id="makiCanvas"></canvas>
        <div class="maki-overlay" id="makiOverlay">
          <div class="maki-overlay-title">Saut de Maki</div>
          <div class="maki-overlay-text">Tape l’écran pour voler entre les bambous.<br>Record : ${progress.miniGame.best} bambous</div>
          <button class="btn-primary" id="makiStartBtn">Jouer</button>
        </div>
      </div>
    </div>
  `;
  document.getElementById('backHome').addEventListener('click', ()=>{ clearActiveInterval(); screen={name:'home'}; render(); });

  const canvas = document.getElementById('makiCanvas');
  const W = 320, H = 480;
  canvas.width = W; canvas.height = H;
  const ctx = canvas.getContext('2d');
  const overlay = document.getElementById('makiOverlay');
  const startBtn = document.getElementById('makiStartBtn');
  const pool = allWords();

  let state;
  function resetState(){
    state = {
      bird:{ x:70, y:H/2, vy:0, r:14 },
      pipes:[], score:0, speed:2.4, spawnDistance:210, distSinceSpawn:999,
      running:false, over:false, wordsSeen:new Set(),
    };
  }
  resetState();

  function spawnPipe(){
    const gapH = 150, margin = 50;
    const gapY = margin + Math.random()*(H - margin*2 - gapH);
    const w = pool[Math.floor(Math.random()*pool.length)];
    state.pipes.push({ x:W+30, w:52, gapY, gapH, passed:false, word:w });
  }

  function flap(){
    if(state.over) return;
    if(!state.running){ state.running = true; overlay.style.display = 'none'; }
    state.bird.vy = -6.4;
  }

  function endGame(){
    state.over = true; state.running = false;
    const prevBadges = unlockedBadgeIds(progress);
    if(state.score > progress.miniGame.best) progress.miniGame.best = state.score;
    const xp = state.score * 2;
    progress.xp += xp;
    const newBadges = badgeDiff(prevBadges, progress);
    saveProgress();
    showGameOver(xp, newBadges);
  }

  function showGameOver(xp, newBadges){
    const seenWords = Array.from(state.wordsSeen).map(k=> pool.find(w=>w.key===k)).filter(Boolean);
    let question = null;
    if(seenWords.length){
      const w = seenWords[Math.floor(Math.random()*seenWords.length)];
      question = makeQCM(w, pool, Math.random()<0.5 ? 'mg2fr' : 'fr2mg');
    }
    overlay.innerHTML = `
      <div class="maki-overlay-title">Score : ${state.score}</div>
      <div class="maki-overlay-text">Record : ${progress.miniGame.best} · +${xp} XP</div>
      ${newBadges.length ? `<div class="badges-row">${newBadges.map(id=>{ const b=BADGES.find(x=>x.id===id); return `<div class="badge" title="${b.name}">${b.emoji}</div>`; }).join('')}</div>` : ''}
      ${question ? `
        <div class="maki-question">
          <div class="maki-question-prompt">${question.prompt}</div>
          <div class="maki-question-options">
            ${question.options.map(opt=>`<button class="option-btn selectable maki-opt" data-opt="${encodeURIComponent(opt)}">${opt}</button>`).join('')}
          </div>
        </div>
      ` : ''}
      <button class="btn-primary" id="makiReplayBtn">Rejouer</button>
    `;
    overlay.style.display = 'flex';
    if(question){
      overlay.querySelectorAll('.maki-opt').forEach(btn=>{
        btn.addEventListener('click', (e)=>{
          e.stopPropagation();
          const chosen = decodeURIComponent(btn.dataset.opt);
          const isCorrect = chosen === question.correct;
          overlay.querySelectorAll('.maki-opt').forEach(b=>{
            const val = decodeURIComponent(b.dataset.opt);
            if(val === question.correct) b.classList.add('correct');
            else if(b === btn) b.classList.add('wrong');
            else b.classList.add('dim');
            b.disabled = true;
          });
          if(isCorrect){ progress.xp += 5; saveProgress(); }
        });
      });
    }
    document.getElementById('makiReplayBtn').addEventListener('click', (e)=>{
      e.stopPropagation();
      resetState();
      overlay.style.display = 'none';
      state.running = true;
    });
  }

  canvas.addEventListener('touchstart', (e)=>{ e.preventDefault(); flap(); }, {passive:false});
  canvas.addEventListener('mousedown', flap);
  startBtn.addEventListener('click', (e)=>{ e.stopPropagation(); overlay.style.display='none'; state.running = true; });

  function draw(){
    const g = ctx.createLinearGradient(0,0,0,H);
    g.addColorStop(0, '#2C3B1F'); g.addColorStop(0.55, '#7C9169'); g.addColorStop(1, '#E9E8C4');
    ctx.fillStyle = g; ctx.fillRect(0,0,W,H);

    state.pipes.forEach(p=>{
      ctx.fillStyle = '#3F6B35';
      ctx.fillRect(p.x, 0, p.w, p.gapY);
      ctx.fillRect(p.x, p.gapY+p.gapH, p.w, H-(p.gapY+p.gapH));
      ctx.fillStyle = 'rgba(0,0,0,0.15)';
      for(let ry=10; ry<p.gapY; ry+=26){ ctx.fillRect(p.x, ry, p.w, 4); }
      for(let ry=p.gapY+p.gapH+10; ry<H; ry+=26){ ctx.fillRect(p.x, ry, p.w, 4); }
      ctx.fillStyle = 'rgba(255,255,255,0.92)';
      ctx.font = '600 13px Work Sans, sans-serif';
      ctx.textAlign = 'center';
      ctx.fillText(p.word.mg, p.x + p.w/2, p.gapY + p.gapH/2 + 4);
    });

    const b = state.bird;
    ctx.fillStyle = '#1F2A17';
    for(let i=0;i<4;i++){
      ctx.fillStyle = i%2===0 ? '#1F2A17' : '#F2F1DD';
      ctx.beginPath(); ctx.arc(b.x - 16 - i*7, b.y + 3, 5, 0, Math.PI*2); ctx.fill();
    }
    ctx.fillStyle = '#F2F1DD';
    ctx.beginPath(); ctx.arc(b.x, b.y, b.r, 0, Math.PI*2); ctx.fill();
    ctx.fillStyle = '#1F2A17';
    ctx.beginPath(); ctx.arc(b.x+5, b.y-3, 2.2, 0, Math.PI*2); ctx.fill();

    ctx.fillStyle = 'rgba(255,255,255,0.95)';
    ctx.font = '400 28px Anton, sans-serif';
    ctx.textAlign = 'center';
    ctx.fillText(String(state.score), W/2, 46);
  }

  function loop(){
    if(!state.over){
      if(state.running){
        state.bird.vy += 0.35;
        state.bird.y += state.bird.vy;
        if(state.bird.y < state.bird.r){ state.bird.y = state.bird.r; state.bird.vy = 0; }
        if(state.bird.y > H - state.bird.r){ endGame(); }

        state.distSinceSpawn += state.speed;
        if(state.distSinceSpawn > state.spawnDistance){ spawnPipe(); state.distSinceSpawn = 0; }

        for(const p of state.pipes){
          p.x -= state.speed;
          if(!p.passed && p.x + p.w < state.bird.x){
            p.passed = true; state.score++;
            state.wordsSeen.add(p.word.key);
            state.speed = Math.min(4.6, 2.4 + state.score*0.05);
          }
          const withinX = state.bird.x + state.bird.r > p.x && state.bird.x - state.bird.r < p.x + p.w;
          if(withinX){
            const hitsTop = state.bird.y - state.bird.r < p.gapY;
            const hitsBottom = state.bird.y + state.bird.r > p.gapY + p.gapH;
            if(hitsTop || hitsBottom){ endGame(); }
          }
        }
        state.pipes = state.pipes.filter(p=> p.x + p.w > -10);
      }
      draw();
    }
    activeRAF = requestAnimationFrame(loop);
  }

  draw();
  activeRAF = requestAnimationFrame(loop);
}

loadProgress();
</script>
