<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate">
<meta http-equiv="Pragma" content="no-cache">
<meta http-equiv="Expires" content="0">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="MADA">
<link rel="apple-touch-icon" href="icon-180.jpg">
<link rel="icon" type="image/jpeg" href="icon-192.jpg">
<link rel="manifest" href="manifest.json">
<meta name="theme-color" content="#2C3B1F">
<title>MADA — Apprendre le malgache</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Anton&family=Work+Sans:ital,wght@0,400;0,500;0,600;0,700;1,500&family=IBM+Plex+Mono:wght@500;600&display=swap" rel="stylesheet">
<style>
  :root{
    --paper:#F2F1DD;
    --paper-light:#FBFBF1;
    --ink:#1F2A17;
    --ink-soft:#55613f;
    --laterite:#C1502E;
    --laterite-dark:#963D22;
    --jade:#3F6B35;
    --jade-dark:#2C4D26;
    --gold:#A7B563;
    --grad-deep:#2C3B1F;
    --grad-mid:#7C9169;
    --grad-light:#E9E8C4;
    --line: rgba(31,42,23,0.14);
    --shadow: 0 10px 30px rgba(31,42,23,0.16);
    --tabbar-bg-1: rgba(255,255,255,0.48);
    --tabbar-bg-2: rgba(255,255,255,0.22);
    --tabbar-border: rgba(255,255,255,0.5);
    --tabbar-active-1: rgba(255,255,255,0.85);
    --tabbar-active-2: rgba(255,255,255,0.55);
    --glass-1: rgba(255,255,255,0.55);
    --glass-2: rgba(255,255,255,0.22);
    --glass-border: rgba(255,255,255,0.55);
  }
  body.dark-mode{
    --paper:#161D12;
    --paper-light:#212B19;
    --ink:#EDEADA;
    --ink-soft:#9AA688;
    --laterite:#D9633C;
    --laterite-dark:#B14C2A;
    --jade:#5C9A4E;
    --jade-dark:#4A7C3F;
    --gold:#C9D17E;
    --line: rgba(237,234,218,0.14);
    --shadow: 0 10px 30px rgba(0,0,0,0.5);
    --tabbar-bg-1: rgba(33,43,25,0.58);
    --tabbar-bg-2: rgba(33,43,25,0.28);
    --tabbar-border: rgba(237,234,218,0.16);
    --tabbar-active-1: rgba(60,74,45,0.9);
    --tabbar-active-2: rgba(60,74,45,0.6);
    --glass-1: rgba(255,255,255,0.09);
    --glass-2: rgba(255,255,255,0.03);
    --glass-border: rgba(255,255,255,0.14);
  }
  *{box-sizing:border-box;}
  html,body{margin:0;padding:0;}
  body{ padding-top:env(safe-area-inset-top, 0px); padding-bottom:env(safe-area-inset-bottom, 0px); transition:background-color .3s ease, color .3s ease; }
  body{
    background:var(--paper);
    color:var(--ink);
    font-family:'Work Sans', sans-serif;
    min-height:100vh;
    -webkit-font-smoothing:antialiased;
  }
  h1,h2,h3,.display{
    font-family:'Anton', sans-serif;
    font-weight:400;
    letter-spacing:0.01em;
    margin:0;
  }
  .mono{ font-family:'IBM Plex Mono', monospace; letter-spacing:0.02em; }
  button{ font-family:inherit; cursor:pointer; }
  button:focus-visible, .selectable:focus-visible{
    outline:3px solid var(--jade);
    outline-offset:2px;
  }

  .lamba-band{
    height:16px;
    width:100%;
    background: radial-gradient(circle at 15% 90%, var(--grad-light) 0%, var(--grad-mid) 45%, var(--grad-deep) 85%);
  }
  .lamba-band.thin{ height:8px; }

  #app{ max-width:720px; margin:0 auto; padding-bottom:60px; }
  .container{ padding:28px 20px 0; }

  .home-header{ padding:8px 0 6px; }
  .eyebrow{
    display:inline-block; font-family:'IBM Plex Mono', monospace; font-size:12px;
    letter-spacing:0.14em; text-transform:uppercase; color:var(--jade-dark);
    background:rgba(63,107,53,0.1); padding:4px 10px; border-radius:100px; margin-bottom:14px;
  }
  .hero-card{
    background: radial-gradient(circle, var(--grad-light) 0%, var(--grad-mid) 42%, var(--grad-deep) 100%);
    background-size:200% 200%;
    border-radius:22px; padding:22px 20px; box-shadow:0 14px 34px rgba(31,42,23,0.32), inset 0 1px 0 rgba(255,255,255,0.15);
    position:relative; overflow:hidden;
    animation:heroDrift 14s ease-in-out infinite alternate;
  }
  @keyframes heroDrift{
    0%{ background-position:12% 8%; }
    50%{ background-position:30% 26%; }
    100%{ background-position:18% 14%; }
  }
  .hero-row{ display:flex; align-items:center; justify-content:space-between; gap:14px; }
  .hero-logo{
    width:83px; color:#fff;
    filter:drop-shadow(0 2px 10px rgba(0,0,0,0.22));
  }
  .hero-logo svg{ display:block; width:100%; height:auto; }
  .hero-sub{ font-family:'IBM Plex Mono',monospace; font-size:10px; letter-spacing:.16em; text-transform:uppercase; color:rgba(255,255,255,0.85); margin-top:8px; }
  .hero-gloss{ text-transform:none; letter-spacing:0; opacity:0.8; }
  .home-section{ margin-top:26px; }
  .home-section-title{ font-family:'IBM Plex Mono',monospace; font-size:11px; text-transform:uppercase; letter-spacing:.12em; color:var(--ink-soft); margin-bottom:10px; padding-left:2px; }
  .version-tag{ text-align:center; font-size:10.5px; color:var(--ink-soft); opacity:0.55; margin-top:8px; }
  .footer-version{ display:block; width:100%; text-align:center; font-size:10.5px; color:var(--ink-soft); opacity:0.4; margin-top:28px; padding-bottom:6px; background:none; border:none; text-decoration:underline; text-decoration-color:transparent; }
  .footer-version:active{ opacity:0.7; }

  .changelog-weight{ margin:16px 20px 0; text-align:center; font-family:'IBM Plex Mono',monospace; font-size:11.5px; color:var(--jade-dark); background:rgba(63,107,53,0.08); border-radius:10px; padding:8px 12px; }
  .changelog-entry{ margin:0 20px 14px; background:linear-gradient(160deg, var(--glass-1), var(--glass-2)); backdrop-filter:blur(14px) saturate(160%); -webkit-backdrop-filter:blur(14px) saturate(160%); border:1px solid var(--glass-border); border-radius:14px; padding:14px 16px; box-shadow:var(--shadow); }
  .changelog-version{ font-family:'Anton',sans-serif; font-size:15px; color:var(--jade-dark); letter-spacing:.01em; }
  .changelog-list{ margin:8px 0 0; padding-left:18px; }
  .changelog-group{ margin:0 20px 14px; }
  .changelog-group-title{
    font-family:'Anton',sans-serif; font-size:14px; color:var(--ink-soft); cursor:pointer; list-style:none;
    padding:10px 4px; display:flex; align-items:center; gap:8px;
  }
  .changelog-group-title::-webkit-details-marker{ display:none; }
  .changelog-group-count{ font-family:'IBM Plex Mono',monospace; font-size:10.5px; font-weight:400; color:var(--ink-soft); opacity:0.7; }
  .changelog-group .changelog-entry{ margin:0 0 14px; }
  .changelog-group[open] .changelog-entry:first-of-type{ margin-top:4px; }
  .changelog-list li{ font-size:12.5px; color:var(--ink-soft); line-height:1.6; }

  .tab-bar{
    position:fixed; left:18px; right:18px; bottom:calc(env(safe-area-inset-bottom, 0px) - 8px); z-index:50;
    display:flex; gap:3px;
    background:
      linear-gradient(180deg, var(--tabbar-bg-1), var(--tabbar-bg-2));
    backdrop-filter:blur(28px) saturate(200%);
    -webkit-backdrop-filter:blur(28px) saturate(200%);
    border-radius:24px;
    border:1px solid var(--tabbar-border);
    box-shadow:
      0 12px 32px rgba(31,42,23,0.22),
      0 1px 1px rgba(255,255,255,0.18),
      inset 0 1px 0 rgba(255,255,255,0.35),
      inset 0 -1px 6px rgba(31,42,23,0.06);
    padding:4px;
  }
  .tab-slider{
    position:absolute; top:4px; bottom:4px; left:0; width:0;
    transition:transform .36s cubic-bezier(.30,1.42,.4,1), width .28s ease;
    z-index:0;
  }
  .tab-slider-fill{
    width:100%; height:100%; transform-origin:center;
    background:linear-gradient(180deg, var(--tabbar-active-1), var(--tabbar-active-2));
    border-radius:18px;
    box-shadow:
      0 3px 10px rgba(31,42,23,0.14),
      inset 0 1px 0 rgba(255,255,255,0.2);
  }
  @keyframes sliderOrganic{
    0%{ transform:scaleY(1); }
    32%{ transform:scaleY(0.88); }
    62%{ transform:scaleY(1.07); }
    100%{ transform:scaleY(1); }
  }
  .tab-slider-fill.pop{ animation:sliderOrganic .4s cubic-bezier(.33,1,.68,1); }
  .tab-btn{
    position:relative; z-index:1;
    flex:1; display:flex; flex-direction:column; align-items:center; justify-content:center; gap:2px;
    background:none; border:none; border-radius:18px; padding:6px 2px 5px; color:var(--ink-soft);
    transition:transform .15s ease;
  }
  .tab-emoji{ display:flex; align-items:center; justify-content:center; opacity:0.55; transition:opacity .2s ease, transform .2s ease, color .2s ease; }
  .tab-label{ font-size:9px; font-family:'IBM Plex Mono',monospace; opacity:0.6; transition:opacity .2s ease, color .2s ease; }
  .tab-btn.active .tab-emoji{ opacity:1; transform:translateY(-1px); color:var(--jade-dark); }
  .tab-btn.active .tab-label{ opacity:1; color:var(--jade-dark); font-weight:700; }
  .tab-btn:active{ transform:scale(0.96); }

  .theme-toggle{
    width:34px; height:34px; border-radius:100px; flex-shrink:0;
    border:1px solid rgba(255,255,255,0.4); background:rgba(255,255,255,0.18); font-size:16px; color:#fff;
    display:flex; align-items:center; justify-content:center; backdrop-filter:blur(8px);
  }
  .theme-toggle{ transition:transform .2s ease; }
  .theme-toggle:active{ transform:scale(0.9) rotate(35deg); }

  .mission-card{
    background:linear-gradient(155deg, var(--grad-mid), var(--grad-deep)); color:#fff;
    border-radius:16px; padding:16px 18px; margin-top:16px; box-shadow:var(--shadow); position:relative; overflow:hidden;
  }
  .mission-label{ font-size:10.5px; text-transform:uppercase; letter-spacing:.1em; color:rgba(255,255,255,0.75); }
  .mission-body{ display:flex; align-items:center; gap:12px; margin-top:8px; }
  .mission-emoji{ font-size:26px; flex-shrink:0; }
  .mission-text{ font-size:13px; line-height:1.4; color:#fff; }
  .mission-btn{ background:rgba(255,255,255,0.16); border:1px solid rgba(255,255,255,0.35); color:#fff; border-radius:100px; padding:9px 16px; font-size:12px; font-weight:600; margin-top:12px; }
  .mission-btn:active{ transform:scale(0.95); }

  .today-grid{ display:grid; grid-template-columns:1fr 1fr; gap:10px; margin-top:16px; }
  .today-card{
    text-align:left; border:none; border-radius:16px; padding:14px 14px 12px;
    background:linear-gradient(160deg, var(--glass-1), var(--glass-2)); backdrop-filter:blur(14px) saturate(160%); -webkit-backdrop-filter:blur(14px) saturate(160%);
    border:1px solid var(--glass-border); box-shadow:var(--shadow);
  }
  .today-card:active{ transform:scale(0.97); }
  .today-card-top{ display:flex; align-items:center; gap:6px; }
  .today-card-emoji{ font-size:15px; }
  .today-card-label{ font-family:'IBM Plex Mono',monospace; font-size:10px; text-transform:uppercase; letter-spacing:.06em; color:var(--ink-soft); }
  .today-card-value{ font-family:'Anton',sans-serif; font-size:26px; color:var(--ink); margin-top:6px; line-height:1; }
  .today-card-unit{ font-family:'IBM Plex Mono',monospace; font-size:12px; color:var(--ink-soft); margin-left:3px; }
  .today-card-sub{ font-size:10.5px; color:var(--ink-soft); margin-top:4px; }
  .today-mini-dots{ display:flex; gap:3px; margin-top:10px; }
  .today-mini-dot{ width:100%; height:5px; border-radius:3px; background:var(--line); }
  .today-mini-dot.filled{ background:var(--laterite); }

  .stats-link{ display:block; text-align:center; margin-top:14px; font-size:13px; color:var(--jade-dark); font-weight:600; background:none; border:none; padding:8px; width:100%; }

  .stats-section{ margin-top:22px; padding:0 20px; }
  .stats-section-title{ font-family:'Anton',sans-serif; font-size:16px; margin-bottom:10px; letter-spacing:.01em; }
  .calendar-weekdays{ display:grid; grid-template-columns:repeat(7,1fr); gap:6px; margin-bottom:6px; }
  .calendar-weekday{ font-size:9px; text-align:center; color:var(--ink-soft); font-family:'IBM Plex Mono',monospace; text-transform:uppercase; }
  .calendar-grid{ display:grid; grid-template-columns:repeat(7,1fr); gap:6px; }
  .calendar-cell{ aspect-ratio:1; display:flex; align-items:center; justify-content:center; border-radius:8px; font-size:11px; font-family:'IBM Plex Mono',monospace; color:var(--ink-soft); background:linear-gradient(160deg, var(--glass-1), var(--glass-2)); backdrop-filter:blur(14px) saturate(160%); -webkit-backdrop-filter:blur(14px) saturate(160%); border:1px solid var(--glass-border); padding:0; }
  .calendar-cell.active{ background:var(--jade); color:#fff; border-color:var(--jade); font-weight:700; }
  .calendar-cell.today{ box-shadow:0 0 0 2px var(--laterite) inset; }
  .calendar-cell.empty{ background:none; border:none; }
  .calendar-cell:disabled{ opacity:0.35; }
  .calendar-cell:active{ transform:scale(0.9); }
  .calendar-hint{ text-align:center; font-size:11.5px; color:var(--ink-soft); margin-top:10px; }
  .calendar-nav{ display:flex; align-items:center; justify-content:space-between; gap:8px; margin-bottom:10px; }
  @keyframes calEnterNext{ from{ opacity:0; transform:translateX(16px); } to{ opacity:1; transform:translateX(0); } }
  @keyframes calEnterPrev{ from{ opacity:0; transform:translateX(-16px); } to{ opacity:1; transform:translateX(0); } }
  .cal-enter-next{ animation:calEnterNext .28s cubic-bezier(.22,.61,.36,1); }
  .cal-enter-prev{ animation:calEnterPrev .28s cubic-bezier(.22,.61,.36,1); }
  .cal-nav-btn{ background:var(--paper-light); border:1px solid var(--line); border-radius:100px; width:30px; height:30px; display:flex; align-items:center; justify-content:center; color:var(--ink-soft); flex-shrink:0; }
  .cal-nav-btn:active{ transform:scale(0.9); }
  .cal-nav-btn:disabled{ opacity:0.3; }

  .dict-search-wrap{ padding:18px 20px 0; }
  .dict-search{
    width:100%; padding:13px 16px; border-radius:14px; border:1px solid var(--line);
    background:var(--paper-light); color:var(--ink); font-size:15px; font-family:'Work Sans', sans-serif;
    box-shadow:var(--shadow); outline:none;
  }
  .dict-search:focus{ border-color:var(--jade); }
  .dict-count{ text-align:center; font-size:11px; color:var(--ink-soft); margin-top:10px; }
  .dict-category{ margin-top:18px; }
  .dict-category:first-child{ margin-top:14px; }
  .dict-category-title{
    margin:0 20px 8px; font-family:'Anton',sans-serif; font-size:14px; color:var(--jade-dark);
    letter-spacing:.01em; display:flex; align-items:baseline; gap:6px; flex-wrap:wrap;
  }
  .dict-category-level{ font-family:'IBM Plex Mono',monospace; font-size:9.5px; color:var(--ink-soft); font-weight:400; letter-spacing:0; text-transform:none; }
  .dict-row{
    display:block; width:calc(100% - 40px); margin:8px 20px 0; text-align:left; cursor:pointer;
    background:linear-gradient(160deg, var(--glass-1), var(--glass-2)); backdrop-filter:blur(14px) saturate(160%); -webkit-backdrop-filter:blur(14px) saturate(160%); border:1px solid var(--glass-border); border-radius:14px;
    padding:13px 16px; box-shadow:var(--shadow);
  }
  .dict-row-main{ display:flex; align-items:baseline; justify-content:space-between; gap:12px; }
  .dict-mg-wrap{ display:flex; align-items:center; gap:6px; }
  .dict-speak{ background:none; border:none; font-size:14px; padding:2px; line-height:1; flex-shrink:0; opacity:0.85; }
  .dict-speak:active{ transform:scale(0.85); }
  .dict-speak-unavailable{ opacity:0.4; }
  .dict-mg{ font-family:'Anton',sans-serif; font-size:15px; color:var(--ink); letter-spacing:.01em; }
  .dict-fr{ font-size:13px; color:var(--ink-soft); text-align:right; }
  .prompt-word::first-letter, .option-btn::first-letter, .match-card::first-letter,
  .dict-mg::first-letter, .dict-fr::first-letter,
  .swipe-card-mg::first-letter, .swipe-card-fr::first-letter{ text-transform:uppercase; }
  .dict-tip{
    max-height:0; overflow:hidden; font-size:12px; color:var(--jade-dark); line-height:1.5;
    transition:max-height .25s ease, margin-top .25s ease;
  }
  .dict-row.open .dict-tip{ max-height:120px; margin-top:10px; }
  .dict-row{ transition:transform .12s ease; }
  .dict-row:active{ transform:scale(0.98); }
  .dict-empty{ text-align:center; color:var(--ink-soft); font-size:13.5px; margin-top:30px; padding:0 20px; }

  .rec-hint{ margin:16px 20px 0; font-size:12.5px; color:var(--ink-soft); line-height:1.5; }
  .beta-badge{
    font-family:'IBM Plex Mono',monospace; font-size:9.5px; text-transform:uppercase; letter-spacing:.06em;
    background:var(--gold); color:#2C3B1F; padding:2px 7px; border-radius:100px; font-weight:600;
  }
  .rec-row{
    display:flex; align-items:center; justify-content:space-between; gap:10px; flex-wrap:wrap;
    width:calc(100% - 40px); margin:8px 20px 0; background:var(--paper-light); border:1px solid var(--line);
    border-radius:14px; padding:12px 14px; box-shadow:var(--shadow);
  }
  .rec-row.recording{ border-color:var(--laterite); animation:answerShake .5s ease infinite; }
  .rec-row-main{ display:flex; flex-direction:column; gap:2px; }
  .rec-actions{ display:flex; gap:6px; flex-shrink:0; }
  .rec-btn{
    border:1.5px solid var(--line); background:var(--paper); border-radius:100px; padding:7px 10px;
    font-size:12px; color:var(--ink); white-space:nowrap;
  }
  .rec-btn.record{ border-color:var(--jade); color:var(--jade-dark); }
  .rec-btn.stop{ background:var(--laterite); border-color:var(--laterite); color:#fff; }
  .rec-btn:active{ transform:scale(0.94); }

  .stat-cards{ display:grid; grid-template-columns:1fr 1fr; gap:10px; }
  .stat-card{ background:linear-gradient(160deg, var(--glass-1), var(--glass-2)); backdrop-filter:blur(14px) saturate(160%); -webkit-backdrop-filter:blur(14px) saturate(160%); border:1px solid var(--glass-border); border-radius:14px; padding:14px; text-align:center; box-shadow:var(--shadow); }
  .stat-value{ font-family:'Anton',sans-serif; font-size:22px; color:var(--jade-dark); }
  .stat-label{ font-size:10.5px; color:var(--ink-soft); margin-top:4px; }

  .xp-chart{ display:flex; align-items:flex-end; gap:4px; height:90px; margin-top:6px; background:linear-gradient(160deg, var(--glass-1), var(--glass-2)); backdrop-filter:blur(14px) saturate(160%); -webkit-backdrop-filter:blur(14px) saturate(160%); border:1px solid var(--glass-border); border-radius:14px; padding:12px; box-shadow:var(--shadow); }
  .xp-bar-wrap{ flex:1; display:flex; flex-direction:column; align-items:center; justify-content:flex-end; height:100%; gap:4px; }
  @keyframes barGrow{ from{ transform:scaleY(0); } to{ transform:scaleY(1); } }
  .xp-bar{ width:100%; background:var(--jade); border-radius:3px 3px 0 0; min-height:2px; transform-origin:bottom; animation:barGrow .5s cubic-bezier(.22,.61,.36,1) both; }
  .xp-bar-label{ font-size:7.5px; color:var(--ink-soft); font-family:'IBM Plex Mono',monospace; }
  .xp-bar-wrap.selected .xp-bar{ background:var(--laterite); }
  .xp-bar-wrap.selected .xp-bar-label{ color:var(--laterite); font-weight:700; }
  .xp-detail{ text-align:center; font-size:12px; color:var(--ink-soft); margin-top:8px; }

  .ring-card{
    display:flex; align-items:center; justify-content:center; gap:0; position:relative;
    background:linear-gradient(160deg, var(--glass-1), var(--glass-2)); backdrop-filter:blur(14px) saturate(160%); -webkit-backdrop-filter:blur(14px) saturate(160%);
    border:1px solid var(--glass-border); border-radius:16px; padding:20px; box-shadow:var(--shadow);
  }
  .progress-ring{ width:140px; height:140px; transform:rotate(-90deg); }
  .progress-ring-bg{ fill:none; stroke:var(--line); stroke-width:9; }
  .progress-ring-fill{ fill:none; stroke:var(--jade); stroke-width:9; stroke-linecap:round; transition:stroke-dashoffset .6s cubic-bezier(.22,.61,.36,1); }
  .ring-center{ position:absolute; text-align:center; }
  .ring-pct{ font-family:'Anton',sans-serif; font-size:26px; color:var(--ink); }
  .ring-label{ font-size:10.5px; color:var(--ink-soft); margin-top:2px; }

  .level-bars{
    background:linear-gradient(160deg, var(--glass-1), var(--glass-2)); backdrop-filter:blur(14px) saturate(160%); -webkit-backdrop-filter:blur(14px) saturate(160%);
    border:1px solid var(--glass-border); border-radius:16px; padding:14px 16px; box-shadow:var(--shadow);
  }
  .level-bar-row{ display:flex; align-items:center; gap:10px; padding:7px 0; }
  .level-bar-label{ font-size:12px; color:var(--ink); width:112px; flex-shrink:0; }
  .level-bar-track{ flex:1; height:8px; border-radius:100px; background:var(--line); overflow:hidden; }

/* ======================= Défi du jour ======================= */
function wordOfTheDay(dateStr){
  const words = allWords();
  let hash = 7;
  for(let i=0;i<dateStr.length;i++){ hash = (hash*37 + dateStr.charCodeAt(i)) >>> 0; }
  return words[hash % words.length];
}
function ensureDaily(){
  const today = todayStr();
  if(!progress.daily || progress.daily.date !== today){
    if(progress.daily && progress.daily.date){
      if(!progress.xpHistory) progress.xpHistory = [];
      progress.xpHistory.push({ date: progress.daily.date, xp: progress.daily.xp||0 });
      if(progress.xpHistory.length > 60) progress.xpHistory = progress.xpHistory.slice(-60);
    }
    progress.daily = { date: today, xp:0, cards:0, maki:0, quiz:0, claimed:false };
  }
}
function bumpDaily(metric, amount){
  ensureDaily();
  progress.daily[metric] = (progress.daily[metric]||0) + amount;
  markTodayActive();
}
function grantXP(amount){
  progress.xp += amount;
  bumpDaily('xp', amount);
}

function initTabBar(){
  const bar = document.createElement('div');
  bar.className = 'tab-bar';
  bar.innerHTML = `
    <div class="tab-slider" id="tabSlider"><div class="tab-slider-fill" id="tabSliderFill"></div></div>
    ${TABS.map(t => `
      <button class="tab-btn selectable" data-tab="${t.id}">
        <div class="tab-emoji">${feather(t.icon, 20)}</div>
        <div class="tab-label">${t.label}</div>
      </button>
    `).join('')}
  `;
  document.body.appendChild(bar);
  bar.querySelectorAll('[data-tab]').forEach(btn=>{
    btn.addEventListener('click', ()=>{
      if(tabBarDragged){ tabBarDragged = false; return; }
      screen = { name: btn.dataset.tab };
      render();
    });
  });

  let dragging = false;
  let startX = 0;
  bar.addEventListener('pointerdown', (e)=>{
    dragging = true;
    tabBarDragged = false;
    startX = e.clientX;
    try{ bar.setPointerCapture(e.pointerId); }catch(err){}
  });
  bar.addEventListener('pointermove', (e)=>{
    if(!dragging) return;
    if(!tabBarDragged && Math.abs(e.clientX - startX) > 6) tabBarDragged = true;
    if(!tabBarDragged) return;
    const slider = document.getElementById('tabSlider');
    const firstBtn = bar.querySelector('.tab-btn');
    if(!slider || !firstBtn) return;
    const barRect = bar.getBoundingClientRect();
    const btnWidth = firstBtn.getBoundingClientRect().width;
    let x = e.clientX - barRect.left - btnWidth/2;
    x = Math.max(4, Math.min(x, barRect.width - btnWidth - 4));
    slider.style.transition = 'none';
    slider.style.transform = `translateX(${x}px)`;
  });
  function endDrag(e){
    if(!dragging) return;
    dragging = false;
    if(!tabBarDragged) return;
    const btns = [...bar.querySelectorAll('.tab-btn')];
    let closestIdx = 0, closestDist = Infinity;
    btns.forEach((b,i)=>{
      const r = b.getBoundingClientRect();
      const center = r.left + r.width/2;
      const dist = Math.abs(e.clientX - center);
      if(dist < closestDist){ closestDist = dist; closestIdx = i; }
    });
    const slider = document.getElementById('tabSlider');
    if(slider) slider.style.transition = '';
    screen = { name: TABS[closestIdx].id };
    render();
  }
  bar.addEventListener('pointerup', endDrag);
  bar.addEventListener('pointercancel', ()=>{ dragging = false; tabBarDragged = false; });
}

async function loadProgress(){
  try{
    const raw = localStorage.getItem('malagasy-progress');
    if(raw){
      const parsed = JSON.parse(raw);
      if(parsed && parsed.chapters){
        progress = freshProgress();
        progress.chapters = parsed.chapters || {};
        progress.xp = parsed.xp || 0;
        progress.revision = Object.assign(freshProgress().revision, parsed.revision || {});
        progress.srs = parsed.srs || {};
        progress.srsSessionsCompleted = parsed.srsSessionsCompleted || 0;
        progress.streak = parsed.streak || { count:0, lastDate:null, history:[] };
        if(!progress.streak.history){
          progress.streak.history = [];
          if(progress.streak.count > 0 && progress.streak.lastDate){
            const end = new Date(progress.streak.lastDate + 'T00:00:00');
            for(let i = progress.streak.count - 1; i >= 0; i--){
              const d = new Date(end.getTime() - i*86400000);
              progress.streak.history.push(`${d.getFullYear()}-${String(d.getMonth()+1).padStart(2,'0')}-${String(d.getDate()).padStart(2,'0')}`);
            }
          }
        }
        progress.miniGame = parsed.miniGame || { best:0 };
        progress.cardsLearned = parsed.cardsLearned || 0;
        progress.daily = parsed.daily || { date:null, xp:0, cards:0, maki:0, quiz:0, claimed:false };
        progress.themeMode = parsed.themeMode || (parsed.darkMode ? 'dark' : 'auto');
        progress.xpHistory = parsed.xpHistory || [];
        progress.miniGame = progress.miniGame || { best:0, bestHard:0 };
        if(progress.miniGame.bestHard === undefined) progress.miniGame.bestHard = 0;
      } else if(parsed && typeof parsed === 'object'){
        progress = freshProgress();
        progress.chapters = parsed;
      }
    }
  }catch(e){ progress = freshProgress(); }
  if(!progress.streak) progress.streak = { count:0, lastDate:null, history:[], best:0 };
  if(progress.streak.best === undefined) progress.streak.best = progress.streak.count||0;
  recomputeStreakCount();
  applyTheme();
  if(window.matchMedia){
    const mq = window.matchMedia('(prefers-color-scheme: dark)');
    const onChange = ()=>{ if(progress.themeMode === 'auto'){ applyTheme(); render(); } };
    if(mq.addEventListener) mq.addEventListener('change', onChange);
    else if(mq.addListener) mq.addListener(onChange);
  }
  document.addEventListener('visibilitychange', ()=>{
    if(document.visibilityState === 'visible'){
      const prevCount = progress.streak.count;
      recomputeStreakCount();
      if(progress.streak.count !== prevCount) render();
    }
  });
  render();
}

function shuffle(arr){ return arr.map(v=>[Math.random(),v]).sort((a,b)=>a[0]-b[0]).map(v=>v[1]); }
function starsString(n){ return '★★★'.slice(0, n) + '☆☆☆'.slice(0, 3-n); }

function currentRank(xp){ let r = RANKS[0]; for(const rk of RANKS){ if(xp >= rk.min) r = rk; } return r; }

function makeQCM(word, pool, direction){
  const prompt = direction === 'mg2fr' ? word.mg : word.fr;
  const correct = direction === 'mg2fr' ? word.fr : word.mg;
  let distractors = pool.filter(x=>x!==word).map(x=> direction==='mg2fr' ? x.fr : x.mg);
  distractors = shuffle(distractors).slice(0,3);
  const options = shuffle([correct, ...distractors]);
  return { type:'qcm', direction, prompt, correct, options };
}

function buildQuestions(chapter){
  const words = chapter.words;
  const qcm = words.map((w,i)=> makeQCM(w, words, i % 2 === 0 ? 'mg2fr' : 'fr2mg'));
  const matchWords = shuffle(words).slice(0, Math.min(6, words.length));
  return { qcm: shuffle(qcm), match: matchWords };
}

function allWords(){
  return LEVELS.flatMap(l => l.chapters.flatMap(c => c.words.map(w => ({
    mg: w.mg, fr: w.fr, tip: w.tip || '', key: c.id + '::' + w.mg, levelId: l.id
  }))));
}

/* ======================= Dictionnaire (recherche) ======================= */
const NUMBER_WORDS_FR = { 1:'un', 2:'deux', 3:'trois', 4:'quatre', 5:'cinq', 6:'six', 7:'sept', 8:'huit', 9:'neuf', 10:'dix' };
function normalizeSearch(s){
  return s.toLowerCase().normalize('NFD').replace(/[\u0300-\u036f]/g, '').trim();
}
function searchDictionary(query){
  const words = allWords();
  const q = normalizeSearch(query || '');
  if(!q) return words.slice().sort((a,b)=> a.mg.localeCompare(b.mg, 'fr'));
  let numberHint = '';
  if(/^\d+$/.test(q)){
    const n = parseInt(q, 10);
    if(NUMBER_WORDS_FR[n]) numberHint = normalizeSearch(NUMBER_WORDS_FR[n]);
  }
  return words
    .filter(w=>{
      const mg = normalizeSearch(w.mg), fr = normalizeSearch(w.fr);
      if(mg.includes(q) || fr.includes(q)) return true;
      if(numberHint && fr === numberHint) return true;
      return false;
    })
    .sort((a,b)=> a.mg.localeCompare(b.mg, 'fr'));
}

function srsDueList(now){
  return allWords().filter(w=>{
    const c = progress.srs[w.key];
    return c && c.due <= now;
  }).sort((a,b)=> progress.srs[a.key].due - progress.srs[b.key].due);
}
function srsNewList(){
  return allWords().filter(w => !progress.srs[w.key]);
}
function srsNextDue(now){
  const upcoming = allWords()
    .map(w=>progress.srs[w.key])
    .filter(c=>c && c.due > now)
    .sort((a,b)=>a.due-b.due);
  return upcoming.length ? upcoming[0].due : null;
}
function humanDelay(ms){
  if(ms < 3600000) return `${Math.max(1, Math.round(ms/60000))} min`;
  if(ms < 86400000) return `${Math.round(ms/3600000)} h`;
  return `${Math.round(ms/86400000)} j`;
}
function buildSrsQueue(){
  const now = Date.now();
  const due = srsDueList(now).slice(0, 20);
  const remaining = Math.max(0, 20 - due.length);
  const fresh = shuffle(srsNewList()).slice(0, Math.min(10, remaining));
  return [...shuffle(due), ...shuffle(fresh)].map(w=>w.key);
}
function srsRecordAnswer(key, correct){
  const now = Date.now();
  let card = progress.srs[key];
  if(!card) card = { ef:2.5, interval:0, reps:0, due: now };
  if(correct){
    card.reps++;
    if(card.reps === 1) card.interval = 1;
    else if(card.reps === 2) card.interval = 6;
    else card.interval = Math.round(card.interval * card.ef);
    card.ef = Math.min(2.8, card.ef + 0.05);
    card.due = now + card.interval * 86400000;
  } else {
    card.reps = 0;
    card.ef = Math.max(1.3, card.ef - 0.2);
    card.interval = 0;
    card.due = now;
  }
  progress.srs[key] = card;
}

function srsHomeStatus(){
  const now = Date.now();
  const due = srsDueList(now).length;
  const fresh = srsNewList().length;
  if(due > 0) return `${due} mot${due>1?'s':''} à réviser aujourd’hui`;
  if(fresh > 0) return `${fresh} nouveau${fresh>1?'x':''} mot${fresh>1?'s':''} à découvrir`;
  const next = srsNextDue(now);
  return next ? `Tout est à jour · prochaine dans ${humanDelay(next-now)}` : 'Tout est à jour';
}

function computeHomeBanner(){
  const now = Date.now();
  const due = srsDueList(now).length;

  if(due >= 5){
    return { emoji:'🧠', text:`${due} mots t’attendent en révision intelligente aujourd’hui.`, action:'Réviser', go:()=>{
      const queue = buildSrsQueue();
      if(queue.length === 0){ screen = { name:'srs-empty' }; render(); return; }
      revState = { mode:'srs', queue, pos:0, correct:0, seen:0 };
      screen = { name:'srs-session' }; render();
    }};
  }
  if((progress.streak && progress.streak.count||0) === 0){
    return { emoji:'🔥', text:'Commence ta série aujourd’hui avec un premier exercice.', action:'Apprendre', go:()=>{ screen={name:'learn-hub'}; render(); } };
  }
  if(due > 0){
    return { emoji:'🧠', text:`${due} mot${due>1?'s':''} à revoir en révision intelligente.`, action:'Réviser', go:()=>{ screen={name:'revise-landing'}; render(); } };
  }
  return { emoji:'👋', text:'Prêt pour un peu de malgache aujourd’hui ?', action:'Apprendre', go:()=>{ screen={name:'learn-hub'}; render(); } };
}

function computeAppWeight(){
  try{
    const bytes = new Blob([document.documentElement.outerHTML]).size;
    return (bytes/1024).toFixed(0);
  }catch(e){ return '—'; }
}
function groupChangelogByMajor(){
  const groups = [];
  let current = null;
  CHANGELOG.forEach(entry=>{
    const major = entry.version.split('.')[0];
    if(!current || current.major !== major){
      current = { major, entries:[] };
      groups.push(current);
    }
    current.entries.push(entry);
  });
  return groups;
}
function changelogEntryHTML(entry){
  return `
    <div class="changelog-entry">
      <div class="changelog-version">MADA-V${entry.version}</div>
      <ul class="changelog-list">
        ${entry.changes.map(c=>`<li>${c}</li>`).join('')}
      </ul>
    </div>
  `;
}

function recomputeStreakCount(){
  const hist = new Set(progress.streak.history || []);
  const today = todayStr();
  const yesterday = dateStrDaysAgo(1);
  let cursor;
  if(hist.has(today)) cursor = today;
  else if(hist.has(yesterday)) cursor = yesterday;
  else { progress.streak.count = 0; return; }
  let count = 0;
  while(hist.has(cursor)){
    count++;
    const d = new Date(cursor + 'T00:00:00');
    d.setDate(d.getDate() - 1);
    cursor = `${d.getFullYear()}-${String(d.getMonth()+1).padStart(2,'0')}-${String(d.getDate()).padStart(2,'0')}`;
  }
  progress.streak.count = count;
  if(count > (progress.streak.best||0)) progress.streak.best = count;
}
function toggleCalendarDay(dateStr, monthOffset){
  if(dateStr > todayStr()) return;
  if(!progress.streak.history) progress.streak.history = [];
  const idx = progress.streak.history.indexOf(dateStr);
  if(idx >= 0) progress.streak.history.splice(idx, 1);
  else { progress.streak.history.push(dateStr); progress.streak.history.sort(); }
  recomputeStreakCount();
  saveProgress();
  if(screen.name === 'stats'){ renderCalendarSection(monthOffset||0); }
  else{ render(); }
}

function buildMonthCalendar(monthOffset){
  monthOffset = monthOffset || 0;
  const now = new Date();
  const year = now.getFullYear(), month = now.getMonth() + monthOffset;
  const firstDay = new Date(year, month, 1);
  const daysInMonth = new Date(year, month+1, 0).getDate();
  let startWeekday = (firstDay.getDay() + 6) % 7; // Lundi=0 ... Dimanche=6
  const history = (progress.streak && progress.streak.history) || [];
  const todayStr_ = todayStr();
  const cells = [];
  for(let i=0;i<startWeekday;i++){ cells.push(null); }
  for(let d=1; d<=daysInMonth; d++){
    const dateStr = `${firstDay.getFullYear()}-${String(firstDay.getMonth()+1).padStart(2,'0')}-${String(d).padStart(2,'0')}`;
    cells.push({ day:d, dateStr, active:history.includes(dateStr), isToday: dateStr===todayStr_ });
  }
  const monthLabel = firstDay.toLocaleDateString('fr-FR', { month:'long', year:'numeric' });
  return { monthLabel, cells };
}

function buildXpChartData(){
  const hist = progress.xpHistory || [];
  const map = {};
  hist.forEach(h=>{ map[h.date] = h.xp; });
  map[todayStr()] = progress.daily.xp || 0;
  const days = [];
  for(let i=13;i>=0;i--){
    const dateStr = dateStrDaysAgo(i);
    const d = new Date(dateStr + 'T00:00:00');
    days.push({ dateStr, xp: map[dateStr]||0, label: String(d.getDate()) });
  }
  return days;
}

function buildDictionaryCategories(query){
  const q = (query || '').trim();
  const matchKeys = q ? new Set(searchDictionary(q).map(w=>w.key)) : null;
  const categories = [];
  let total = 0;
  LEVELS.forEach(l=>{
    l.chapters.forEach(c=>{
      const words = c.words
        .map(w=>({ mg:w.mg, fr:w.fr, tip:w.tip||'', key:c.id+'::'+w.mg, levelId:l.id }))
        .filter(w=> !matchKeys || matchKeys.has(w.key));
      if(words.length){
        categories.push({ id:c.id, emoji:c.emoji, title:c.sub, levelTag:l.tag, words });
        total += words.length;
      }
    });
  });
  return { categories, total };
}

/* Liste tenue à jour manuellement à mesure que des enregistrements sont ajoutés au dépôt. */
const WORDS_WITH_AUDIO = new Set([]);
function getMalagasyVoice(){
  if(!window.speechSynthesis) return null;
  const voices = speechSynthesis.getVoices();
  return voices.find(v => v.lang && v.lang.toLowerCase().startsWith('mg')) || null;
}
function speakMalagasy(text, btn){
  const voice = getMalagasyVoice();
  if(!voice){
    if(btn){
      const orig = btn.textContent;
      btn.textContent = '🔇';
      btn.classList.add('dict-speak-unavailable');
      setTimeout(()=>{ btn.textContent = orig; btn.classList.remove('dict-speak-unavailable'); }, 1200);
    }
    return;
  }
  try{
    speechSynthesis.cancel();
    const utter = new SpeechSynthesisUtterance(text);
    utter.voice = voice;
    utter.lang = voice.lang;
    utter.rate = 0.9;
    speechSynthesis.speak(utter);
  }catch(e){ /* ignore */ }
}
let mediaStream = null;
let mediaRecorder = null;
let recordedChunks = [];
let activeRecordingKey = null;
const recordingsStore = {};

function getRecorderMimeType(){
  const candidates = ['audio/mp4', 'audio/webm;codecs=opus', 'audio/webm', 'audio/ogg'];
  for(const type of candidates){
    if(window.MediaRecorder && MediaRecorder.isTypeSupported(type)) return type;
  }
  return '';
}
function extForMime(mime){
  if(!mime) return 'mp3';
  if(mime.includes('mp4')) return 'm4a';
  if(mime.includes('webm')) return 'webm';
  if(mime.includes('ogg')) return 'ogg';
  return 'mp3';
}
async function toggleRecording(key, mg, onDone){
  if(activeRecordingKey === key){
    if(mediaRecorder && mediaRecorder.state !== 'inactive') mediaRecorder.stop();
    return;
  }
  if(activeRecordingKey) return; // une seule prise à la fois
  try{
    if(!mediaStream){
      mediaStream = await navigator.mediaDevices.getUserMedia({ audio:true });
    }
    const mimeType = getRecorderMimeType();
    mediaRecorder = new MediaRecorder(mediaStream, mimeType ? { mimeType } : undefined);
    recordedChunks = [];
    activeRecordingKey = key;
    mediaRecorder.ondataavailable = (e)=>{ if(e.data.size > 0) recordedChunks.push(e.data); };
    mediaRecorder.onstop = ()=>{
      const mime = mediaRecorder.mimeType || mimeType || 'audio/mp4';
      const blob = new Blob(recordedChunks, { type: mime });
      const url = URL.createObjectURL(blob);
      if(recordingsStore[key] && recordingsStore[key].url) URL.revokeObjectURL(recordingsStore[key].url);
      recordingsStore[key] = { url, ext: extForMime(mime), mg };
      activeRecordingKey = null;
      onDone();
    };
    mediaRecorder.start();
    onDone();
  }catch(e){
    activeRecordingKey = null;
    alert('Micro indisponible : vérifie que l’app a l’autorisation d’accéder au micro (Réglages iOS > Safari > Micro).');
    onDone();
  }
}
function downloadRecording(key){
  const rec = recordingsStore[key];
  if(!rec) return;
  const a = document.createElement('a');
  a.href = rec.url;
  a.download = `${slugifyWord(rec.mg)}.${rec.ext}`;
  document.body.appendChild(a);
  a.click();
  a.remove();
}
function recRowHTML(w){
  const rec = recordingsStore[w.key];
  const recording = activeRecordingKey === w.key;
  return `

function playWordAudio(mg, btn){
  const slug = slugifyWord(mg);
  const exts = ['mp3', 'm4a', 'webm', 'ogg'];
  let i = 0;
  function tryNext(){
    if(i >= exts.length){ speakMalagasy(mg, btn); return; }
    const ext = exts[i++];
    const audio = new Audio(`audio/${slug}.${ext}`);
    let handled = false;
    audio.addEventListener('canplaythrough', ()=>{
      if(handled) return;
      handled = true;
      audio.play().catch(tryNext);
    });
    audio.addEventListener('error', ()=>{
      if(handled) return;
      handled = true;
      tryNext();
    });
    audio.load();
  }
  tryNext();
}

const GRAMMAR_RULES = [
  { emoji:'⚖️', title:'Pas de genre', body:`
    <p class="guide-card-text">

    </p>
    <p class="guide-card-text">
      <strong>tsara</strong> veut dire « bon », « bonne », ou « bien » — toujours la même forme,
      que ce soit un homme, une femme, ou une chose. Une case mentale en moins à gérer !
    </p>
  `},
  { emoji:'🔢', title:'Pas de singulier / pluriel', body:`
    <p class="guide-card-text">
      Le mot ne change pas non plus entre un et plusieurs. <strong>trano</strong> veut dire aussi bien
      « maison » que « maisons » — c’est le contexte, un nombre ou un mot comme « maro » (beaucoup)
      qui indiquent qu’il y en a plusieurs.
    </p>
    <p class="guide-card-text">
      Exemple : pour dire « trois maisons », on garde <strong>trano</strong> tel quel et on ajoute

    </p>
  `},
  { emoji:'🧩', title:'Construire une phrase simple', body:`
    <p class="guide-card-text">

    </p>
    <p class="guide-card-text">
      <strong>Tia anao aho</strong> → « aime toi moi » = « je t’aime ».<br>
      <strong>Mankasitraka anao aho</strong> → « remercie toi moi » = « je te remercie ».
    </p>
    <p class="guide-card-text">

      un peu comme « moi, alors... » en français.

      <strong>Izaho dia tsara fa misaotra</strong> = « moi je vais bien, merci ».
    </p>

  { emoji:'📎', title:'Les articles : ny / i', body:`
    <p class="guide-card-text">

    </p>

      <div class="guide-table-row"><span>isika</span><span>nous (avec toi)</span></div>
      <div class="guide-table-row"><span>izahay</span><span>nous (sans toi)</span></div>
      <div class="guide-table-row"><span>ianareo</span><span>vous</span></div>

  `},

function renderQuiz(){
  clearActiveInterval();
  const {level, chapter} = currentLevelAndChapter();
  const q = quizState.queue[quizState.index];
  const progressPct = Math.round((quizState.index / quizState.queue.length) * 100);

  app.innerHTML = `
    <div class="has-tabbar">
      <div class="topbar">
        <button class="back-btn" id="backLevel">${feather('x',18)}</button>
        <div>
          <div class="sub mono">${chapter.title}</div>
          <h2 style="font-size:17px;">${chapter.sub}</h2>
        </div>
      </div>
      <div class="progress-track"><div class="progress-fill" style="width:${progressPct}%"></div></div>
      <div class="quiz-wrap" id="quizWrap"></div>
    </div>
  `;
  document.getElementById('backLevel').addEventListener('click', ()=>{ screen={name:'level', levelId:level.id}; render(); });

  const wrap = document.getElementById('quizWrap');
  if(q.type === 'qcm'){
    wrap.innerHTML = `
      <div class="prompt-card">
        <div class="prompt-kicker mono">${q.direction === 'mg2fr' ? 'Malagasy → Français' : 'Français → Malagasy'}</div>
        <div class="prompt-word">${q.prompt}</div>
      </div>
      <div class="options">
        ${q.options.map(opt => `<button class="option-btn selectable" data-opt="${encodeURIComponent(opt)}">${opt}</button>`).join('')}
      </div>
    `;
    let answered = false;
    wrap.querySelectorAll('.option-btn').forEach(btn=>{
      btn.addEventListener('click', ()=>{
        if(answered) return;
        answered = true;
        const chosen = decodeURIComponent(btn.dataset.opt);
        const isCorrect = chosen === q.correct;
        if(isCorrect){ quizState.correct++; quizState.qcmCorrectCount++; }
        wrap.querySelectorAll('.option-btn').forEach(b=>{
          const val = decodeURIComponent(b.dataset.opt);
          if(val === q.correct) b.classList.add('correct');
          else if(b === btn) b.classList.add('wrong');
          else b.classList.add('dim');
          b.disabled = true;
        });
        const nextBtn = document.createElement('button');
        nextBtn.className = 'next-btn';
        nextBtn.textContent = (quizState.index < quizState.queue.length - 1) ? 'Suivant' : 'Continuer';
        nextBtn.addEventListener('click', advanceQuiz);
        wrap.appendChild(nextBtn);
      });
    });
  } else if(q.type === 'match'){
    const mgItems = shuffle(q.words.map((w,i)=>({key:i, text:w.mg})));
    const frItems = shuffle(q.words.map((w,i)=>({key:i, text:w.fr})));
    quizState.matchState = { matched:new Set(), selectedMg:null, selectedFr:null, mistakes:0, total:q.words.length };
    wrap.innerHTML = `
      <div class="prompt-card" style="padding:22px 18px;">
        <div class="prompt-kicker mono">Jeu d’association</div>
        <div style="font-size:14px; color:var(--ink-soft);">Relie chaque mot malgache à sa traduction.</div>
      </div>
      <div class="match-grid" style="margin-top:16px;">
        <div class="match-col" id="colMg">
          ${mgItems.map(it=>`<button class="match-card selectable" data-side="mg" data-key="${it.key}">${it.text}</button>`).join('')}
        </div>
        <div class="match-col" id="colFr">
          ${frItems.map(it=>`<button class="match-card selectable" data-side="fr" data-key="${it.key}">${it.text}</button>`).join('')}
        </div>
      </div>
      <div class="match-hint">Trouve les ${q.words.length} paires.</div>
    `;
    wrap.querySelectorAll('.match-card').forEach(card=>{
      card.addEventListener('click', ()=> handleMatchClick(card, q));
    });
  }
}

function handleMatchClick(card, q){
  const ms = quizState.matchState;
  const side = card.dataset.side;
  if(card.classList.contains('matched')) return;

  if(side === 'mg'){
    document.querySelectorAll('[data-side="mg"]').forEach(c=>c.classList.remove('selected'));
    card.classList.add('selected');
    ms.selectedMg = { key: card.dataset.key, el: card };
  } else {
    document.querySelectorAll('[data-side="fr"]').forEach(c=>c.classList.remove('selected'));
    card.classList.add('selected');
    ms.selectedFr = { key: card.dataset.key, el: card };
  }

  if(ms.selectedMg && ms.selectedFr){
    const isMatch = ms.selectedMg.key === ms.selectedFr.key;
    if(isMatch){
      ms.selectedMg.el.classList.remove('selected');
      ms.selectedFr.el.classList.remove('selected');
      ms.selectedMg.el.classList.add('matched');
      ms.selectedFr.el.classList.add('matched');
      ms.matched.add(ms.selectedMg.key);
      ms.selectedMg = null; ms.selectedFr = null;
      if(ms.matched.size === ms.total){
        quizState.correct += Math.max(0, ms.total - ms.mistakes) >= ms.total - 1 ? 1 : 0.5;
        setTimeout(advanceQuiz, 550);
      }
    } else {
      ms.mistakes++;
      const a = ms.selectedMg.el, b = ms.selectedFr.el;
      a.classList.add('wrong'); b.classList.add('wrong');
      setTimeout(()=>{ a.classList.remove('wrong','selected'); b.classList.remove('wrong','selected'); }, 420);
      ms.selectedMg = null; ms.selectedFr = null;
    }
  }
}

function advanceQuiz(){
  quizState.index++;
  if(quizState.index >= quizState.queue.length){ finishQuiz(); } else { render(); }
}

function finishQuiz(){
  const {chapter} = currentLevelAndChapter();
  const maxPoints = quizState.total + 1;
  const pct = quizState.correct / maxPoints;
  let stars = 0;
  if(pct >= 0.85) stars = 3; else if(pct >= 0.6) stars = 2; else if(pct > 0) stars = 1;

  const prevBadges = unlockedBadgeIds(progress);
  const prevBest = progress.chapters[chapter.id] || 0;
  if(stars > prevBest) progress.chapters[chapter.id] = stars;

  const matchXP = quizState.matchState ? Math.max(5, 15 - quizState.matchState.mistakes*3) : 0;
  const xpGained = quizState.qcmCorrectCount * 10 + matchXP;
  grantXP(xpGained);
  bumpDaily('quiz', 1);
  const newBadges = badgeDiff(prevBadges, progress);
  celebrateNewBadges(newBadges);
  saveProgress();

  screen = { name:'result', stars, correct: quizState.correct, max: maxPoints, chapterId: chapter.id, xpGained, newBadges };
  render();
}

function startRevisionMode(level, mode){
  const pool = combinedPool(level);
  if(mode === 'cards'){
    const deck = shuffle(pool).map(w=>({ mg:w.mg, fr:w.fr, tip:w.tip||'', misses:0 }));
    revState = { levelId:level.id, mode:'cards', deck, learned:0, seenTotal:0 };
    screen = { name:'rev-cards' };
  } else if(mode === 'speed'){
    const n = Math.min(12, pool.length);
    const chosen = shuffle(pool).slice(0, n);
    const questions = chosen.map((w,i)=> makeQCM(w, pool, i%2===0 ? 'mg2fr' : 'fr2mg'));
    revState = { levelId:level.id, mode:'speed', questions, index:0, correct:0, combo:0, bestCombo:0, xp:0 };
    screen = { name:'rev-speed' };
  } else if(mode === 'truefalse'){
    const n = Math.min(10, pool.length);
    const chosen = shuffle(pool).slice(0, n);
    const rounds = chosen.map(w=>{
      const isTrue = Math.random() < 0.5;
      let shown;
      if(isTrue){ shown = w.fr; }
      else { const others = pool.filter(x=>x!==w).map(x=>x.fr); shown = shuffle(others)[0] || w.fr; }
      return { mg:w.mg, shown, isTrue: shown === w.fr };
    });
    revState = { levelId:level.id, mode:'truefalse', rounds, index:0, correct:0, combo:0, bestCombo:0 };
    screen = { name:'rev-truefalse' };
  } else if(mode === 'survival'){
    revState = { levelId:level.id, mode:'survival', pool, hearts:3, correct:0, current:null };
    revState.current = makeQCM(pool[Math.floor(Math.random()*pool.length)], pool, Math.random()<0.5?'mg2fr':'fr2mg');
    screen = { name:'rev-survival' };
  } else if(mode === 'memory'){
    const n = Math.min(8, pool.length);
    const chosen = shuffle(pool).slice(0, n);
    revState = { levelId:level.id, mode:'memory', words: chosen, mistakes:0, matched:new Set(), selectedMg:null, selectedFr:null };
    screen = { name:'rev-memory' };
  }
  render();
}

function handleMemoryClick(card){
  const st = revState;
  if(card.classList.contains('matched')) return;
  const side = card.dataset.side;

  if(side === 'mg'){
    document.querySelectorAll('[data-side="mg"]').forEach(c=>c.classList.remove('selected'));
    card.classList.add('selected');
    st.selectedMg = { key: card.dataset.key, el: card };
  } else {
    document.querySelectorAll('[data-side="fr"]').forEach(c=>c.classList.remove('selected'));
    card.classList.add('selected');
    st.selectedFr = { key: card.dataset.key, el: card };
  }

  if(st.selectedMg && st.selectedFr){
    const isMatch = st.selectedMg.key === st.selectedFr.key;
    if(isMatch){
      st.selectedMg.el.classList.remove('selected');
      st.selectedFr.el.classList.remove('selected');
      st.selectedMg.el.classList.add('matched');
      st.selectedFr.el.classList.add('matched');
      st.matched.add(st.selectedMg.key);
      st.selectedMg = null; st.selectedFr = null;
      if(st.matched.size === st.words.length){ setTimeout(finishRevMemory, 500); }
    } else {
      st.mistakes++;
      const a = st.selectedMg.el, b = st.selectedFr.el;
      a.classList.add('wrong'); b.classList.add('wrong');
      setTimeout(()=>{
        a.classList.remove('wrong','selected');
        b.classList.remove('wrong','selected');
        const scoreEl = document.querySelector('.score-row');
        if(scoreEl) scoreEl.textContent = `Erreurs : ${st.mistakes}`;
      }, 420);
      st.selectedMg = null; st.selectedFr = null;
    }
  }
}

function finishRevMemory(){
  const st = revState;
  const prevBadges = unlockedBadgeIds(progress);
  if(progress.revision.memory.bestMistakes === null || st.mistakes < progress.revision.memory.bestMistakes){
    progress.revision.memory.bestMistakes = st.mistakes;
  }
  const xp = Math.max(5, 20 - st.mistakes * 2);
  grantXP(xp);
  bumpDaily('quiz', 1);
  const newBadges = badgeDiff(prevBadges, progress);
  celebrateNewBadges(newBadges);
  saveProgress();
  screen = { name:'rev-result', mode:'memory', levelId: st.levelId, stats:{mistakes: st.mistakes, xp}, newBadges };
  render();
}

function renderRevBuilder(){
  clearActiveInterval();
  const st = revState;
  if(st.index >= st.sentences.length){ return finishRevBuilder(); }
  const sentence = st.sentences[st.index];
  if(!st.slots){
    st.slots = new Array(sentence.tokens.length).fill(null);
    st.bankState = shuffle(sentence.tokens.map((t,i)=>({ text:t, key:i })));
    st.lockedSlots = new Set();
  }

  app.innerHTML = `
    <div class="has-tabbar">
      <div class="topbar">
        <button class="back-btn" id="backHub">${feather('x',18)}</button>
        <div>
          <div class="sub mono">Réviser</div>
          <h2 style="font-size:17px;">🧩 Constructeur de phrases</h2>
        </div>
      </div>
      <div class="quiz-wrap" id="quizWrap">
        <div class="score-row">Phrase ${st.index+1}/${st.sentences.length} · Bonnes : ${st.correct}</div>
        <div class="prompt-card" style="margin-top:12px;">
          <div class="prompt-kicker mono">Français</div>
          <div class="prompt-word" style="font-size:20px;">${sentence.fr}</div>
        </div>
        <div class="builder-zone" id="builderZone"></div>
        <div class="builder-bank" id="builderBank"></div>
        <div class="builder-actions">
          <button class="btn-secondary" id="builderClear">Effacer</button>
          <button class="btn-primary" id="builderCheck">Vérifier</button>
        </div>
        <div class="builder-actions-secondary">
          <button class="builder-link selectable" id="builderHint">💡 Indice</button>
          <button class="builder-link selectable" id="builderReveal">👁️ Révéler la phrase</button>
        </div>
      </div>
    </div>
  `;
  document.getElementById('backHub').addEventListener('click', ()=>{ screen={name:'revise-landing'}; render(); });

  const zone = document.getElementById('builderZone');
  const bankEl = document.getElementById('builderBank');

  function renderZoneAndBank(){
    const anyFilled = st.slots.some(s=>s);
    zone.innerHTML = anyFilled
      ? st.slots.map((s,i)=>{
          if(!s) return `<div class="builder-slot empty"></div>`;
          const locked = st.lockedSlots.has(i);
          return `<button class="builder-chip placed ${locked?'locked':''}" data-slot="${i}" ${locked?'disabled':''}>${s.text}</button>`;
        }).join('')
      : `<div class="builder-placeholder">Tape les mots ci-dessous, dans l’ordre</div>`;
    const placedKeys = new Set(st.slots.filter(Boolean).map(s=>s.key));
    bankEl.innerHTML = st.bankState
      .filter(t=> !placedKeys.has(t.key))
      .map(t=>`<button class="builder-chip selectable" data-key="${t.key}">${t.text}</button>`).join('');

    zone.querySelectorAll('.builder-chip:not(.locked)').forEach(chip=>{
      chip.addEventListener('click', ()=>{
        const idx = Number(chip.dataset.slot);
        st.slots[idx] = null;
        renderZoneAndBank();
      });
    });
    bankEl.querySelectorAll('.builder-chip').forEach(chip=>{
      chip.addEventListener('click', ()=>{
        const key = Number(chip.dataset.key);
        const emptyIdx = st.slots.findIndex(s=>!s);
        if(emptyIdx === -1) return;
        st.slots[emptyIdx] = st.bankState.find(t=>t.key===key);
        renderZoneAndBank();
      });
    });
  }
  renderZoneAndBank();

  document.getElementById('builderHint').addEventListener('click', ()=>{
    const idx = st.slots.findIndex((s,i)=> !s || (!st.lockedSlots.has(i) && s.text !== sentence.tokens[i]));
    if(idx === -1) return;
    st.slots[idx] = st.bankState.find(t=>t.key===idx);
    st.lockedSlots.add(idx);
    renderZoneAndBank();
  });
  document.getElementById('builderReveal').addEventListener('click', ()=>{
    st.slots = sentence.tokens.map((t,i)=> st.bankState.find(b=>b.key===i));
    st.lockedSlots = new Set(sentence.tokens.map((_,i)=>i));
    renderZoneAndBank();
    zone.classList.add('builder-zone-revealed');
    setTimeout(()=>{ st.index++; st.slots=null; render(); }, 1400);
  });

  document.getElementById('builderClear').addEventListener('click', ()=>{
    st.slots = new Array(sentence.tokens.length).fill(null);
    st.lockedSlots = new Set();
    renderZoneAndBank();
  });
  document.getElementById('builderCheck').addEventListener('click', ()=>{
    let hasWrong = false;
    let hasEmpty = false;
    st.slots.forEach((s,i)=>{
      if(!s){ hasEmpty = true; return; }
      if(s.text === sentence.tokens[i]) st.lockedSlots.add(i);
    });
    renderZoneAndBank();
    const chips = [...zone.querySelectorAll('.builder-chip')];
    st.slots.forEach((s,i)=>{
      if(!s) return;
      if(!st.lockedSlots.has(i)){
        hasWrong = true;
        const chip = chips.find(c=>Number(c.dataset.slot)===i);
        if(chip){
          chip.classList.add('wrong');
          setTimeout(()=> chip.classList.remove('wrong'), 500);
        }
      }
    });
    const complete = st.lockedSlots.size === sentence.tokens.length;
    if(complete){
      st.correct++;
      zone.classList.add('builder-zone-correct');
      setTimeout(()=>{ st.index++; st.slots=null; render(); }, 700);
    }
  });
}

function finishRevBuilder(){
  const st = revState;
  const prevBadges = unlockedBadgeIds(progress);
  if(!progress.revision.builder) progress.revision.builder = { best:0 };
  if(st.correct > progress.revision.builder.best) progress.revision.builder.best = st.correct;
  const xp = st.correct * 8;
  grantXP(xp);
  bumpDaily('quiz', 1);
  const newBadges = badgeDiff(prevBadges, progress);
  celebrateNewBadges(newBadges);
  saveProgress();
  screen = { name:'rev-result', mode:'builder', stats:{correct: st.correct, total: st.sentences.length, xp}, newBadges };
  render();
}

/* ---- Cartes à retenir (swipe façon Tinder) ---- */
function renderRevCards(){
  clearActiveInterval();
  const st = revState;
  const level = findLevel(st.levelId);
  if(st.deck.length === 0){ return finishRevCards(); }

  const front = st.deck[0];
  const behind = st.deck[1];

  app.innerHTML = `
    <div class="has-tabbar">
      <div class="topbar">
        <button class="back-btn" id="backHub">${feather('x',18)}</button>
        <div>
          <div class="sub mono">${level.name}</div>
          <h2 style="font-size:17px;">🃏 Cartes à retenir</h2>
        </div>
      </div>
      <div class="cards-wrap">
        <div class="cards-progress">Restantes : ${st.deck.length} · Appris : ${st.learned}</div>
        <div class="card-stack" id="cardStack">
          ${behind ? `
            <div class="swipe-card behind">
              <div class="swipe-card-kicker">Malagasy</div>
              <div class="swipe-card-mg">${behind.mg}</div>
            </div>
          ` : ''}
          <div class="swipe-card front" id="frontCard">
            <div class="swipe-stamp left" id="stampLeft">REVOIR</div>
            <div class="swipe-stamp right" id="stampRight">APPRIS</div>
            <div class="swipe-card-kicker">Malagasy</div>
            <div class="swipe-card-mg">${front.mg}</div>
            <div class="swipe-card-fr">${front.fr}</div>
            ${front.tip ? `<div class="swipe-card-tip"><b>Astuce</b> · ${front.tip}</div>` : ''}
          </div>
        </div>
        <div class="cards-buttons">
          <button class="cards-btn left selectable" id="btnLeft">${feather('x',18)}</button>
          <button class="cards-btn right selectable" id="btnRight">${feather('check',18)}</button>
        </div>
        <div class="cards-hint">Swipe la carte, ou utilise les boutons — à gauche si tu ne le retiens pas encore, à droite si c’est appris.</div>
      </div>
    </div>
  `;
  document.getElementById('backHub').addEventListener('click', ()=>{ screen={name:'revision-hub', levelId:level.id}; render(); });

  const frontCard = document.getElementById('frontCard');
  const stampLeft = document.getElementById('stampLeft');
  const stampRight = document.getElementById('stampRight');
  let dragging = false, startX = 0, startY = 0, dx = 0, locked = false;

  function resolveSwipe(direction){
    if(locked) return;
    locked = true;
    const word = st.deck.shift();
    st.seenTotal++;
    if(direction === 'right'){
      st.learned++;
      progress.cardsLearned = (progress.cardsLearned||0) + 1;
      bumpDaily('cards', 1);
    } else {
      word.misses++;
      const reinsertAt = Math.min(st.deck.length, 2 + Math.floor(Math.random()*3));
      st.deck.splice(reinsertAt, 0, word);
    }
    saveProgress();
    const flyX = direction === 'right' ? 500 : -500;
    frontCard.style.transition = 'transform .35s ease, opacity .35s ease';
    frontCard.style.transform = `translateX(${flyX}px) rotate(${direction==='right'?18:-18}deg)`;
    frontCard.style.opacity = '0';
    setTimeout(()=>{ render(); }, 260);
  }

  function onStart(clientX, clientY){
    if(locked) return;
    dragging = true; startX = clientX; startY = clientY; dx = 0;
    frontCard.style.transition = 'none';
    frontCard.style.cursor = 'grabbing';
  }
  function onMove(clientX, clientY){
    if(!dragging) return;
    dx = clientX - startX;
    const rot = dx / 18;
    frontCard.style.transform = `translateX(${dx}px) rotate(${rot}deg)`;
    const op = Math.min(1, Math.abs(dx)/80);
    if(dx > 0){ stampRight.style.opacity = op; stampLeft.style.opacity = 0; }
    else { stampLeft.style.opacity = op; stampRight.style.opacity = 0; }
  }
  function onEnd(){
    if(!dragging) return;
    dragging = false;
    frontCard.style.cursor = 'grab';
    if(dx > 90){ resolveSwipe('right'); }
    else if(dx < -90){ resolveSwipe('left'); }
    else {
      frontCard.style.transition = 'transform .25s ease';
      frontCard.style.transform = 'translateX(0) rotate(0)';
      stampLeft.style.opacity = 0; stampRight.style.opacity = 0;
    }
  }

  frontCard.addEventListener('pointerdown', (e)=>{
    frontCard.setPointerCapture(e.pointerId);
    onStart(e.clientX, e.clientY);
  });
  frontCard.addEventListener('pointermove', (e)=>{ onMove(e.clientX, e.clientY); });
  frontCard.addEventListener('pointerup', onEnd);
  frontCard.addEventListener('pointercancel', onEnd);

  document.getElementById('btnLeft').addEventListener('click', ()=> resolveSwipe('left'));
  document.getElementById('btnRight').addEventListener('click', ()=> resolveSwipe('right'));
}

function finishRevCards(){
  const st = revState;
  const prevBadges = unlockedBadgeIds(progress);
  const xp = st.learned * 6;
  grantXP(xp);
  bumpDaily('quiz', 1);
  const newBadges = badgeDiff(prevBadges, progress);
  celebrateNewBadges(newBadges);
  saveProgress();
  screen = { name:'rev-result', mode:'cards', levelId: st.levelId, stats:{ learned: st.learned, xp }, newBadges };
  render();
}

function renderRevResult(){
  clearActiveInterval();
  const isBuilder = screen.mode === 'builder';
  const level = isBuilder ? null : findLevel(screen.levelId);
  const s = screen.stats;
  let title, scoreLine;
  if(screen.mode === 'speed'){ title = '⚡ Quiz éclair terminé'; scoreLine = `${s.correct}/${s.total} bonnes réponses · combo max x${s.bestCombo} · +${s.xp} XP`; }
  if(screen.mode === 'truefalse'){ title = '🎯 Vrai ou faux terminé'; scoreLine = `${s.correct}/${s.total} bonnes réponses · +${s.xp} XP`; }
  if(screen.mode === 'survival'){ title = '❤️ Partie terminée'; scoreLine = `${s.correct} bonnes réponses avant la fin des vies · +${s.xp} XP`; }
  if(screen.mode === 'memory'){ title = '🧠 Mémoire terminée'; scoreLine = `${s.mistakes} erreur${s.mistakes>1?'s':''} · +${s.xp} XP`; }
  if(screen.mode === 'cards'){ title = '🃏 Paquet terminé'; scoreLine = `${s.learned} mot${s.learned>1?'s':''} appris · +${s.xp} XP`; }
  if(screen.mode === 'builder'){ title = '🧩 Constructeur terminé'; scoreLine = `${s.correct}/${s.total} phrases correctes · +${s.xp} XP`; }

  app.innerHTML = `
    <div class="has-tabbar">
      <div class="result-wrap">
        <div class="eyebrow">Vaovao</div>
        <h2 style="font-size:24px;">${title}</h2>
        <div class="result-score mono" style="margin-top:16px;">${scoreLine}</div>
        <div class="result-actions">
          <button class="btn-primary" id="retryBtn">Rejouer</button>
          <button class="btn-secondary" id="backHubBtn">${isBuilder ? 'Retour à Réviser' : 'Autres modes de révision'}</button>
        </div>
      </div>
    </div>
  `;
  document.getElementById('retryBtn').addEventListener('click', ()=>{
    if(isBuilder) startSentenceBuilder();
    else startRevisionMode(level, screen.mode);
  });
  document.getElementById('backHubBtn').addEventListener('click', ()=>{
    if(isBuilder) screen = { name:'revise-landing' };
    else screen = { name:'revision-hub', levelId: level.id };
    render();
  });
}

/* ======================= SRS session screens ======================= */
function renderSrsSession(){
  clearActiveInterval();
  const st = revState;
  if(st.pos >= st.queue.length){ return finishSrsSession(); }
  const key = st.queue[st.pos];
  const word = allWords().find(w=>w.key === key);
  const pool = allWords();
  const direction = Math.random() < 0.5 ? 'mg2fr' : 'fr2mg';
  const q = makeQCM(word, pool, direction);
  const remaining = st.queue.length - st.pos;

  app.innerHTML = `
    <div class="has-tabbar">
      <div class="topbar">
        <button class="back-btn" id="backHome">${feather('x',18)}</button>
        <div>
          <div class="sub mono">Révision intelligente</div>
          <h2 style="font-size:17px;">🧠 Cartes restantes : ${remaining}</h2>
        </div>
      </div>
      <div class="quiz-wrap" id="quizWrap">
        <div class="prompt-card">
          <div class="prompt-kicker mono">${q.direction === 'mg2fr' ? 'Malagasy → Français' : 'Français → Malagasy'}</div>
          <div class="prompt-word">${q.prompt}</div>
        </div>
        <div class="options">
          ${q.options.map(opt => `<button class="option-btn selectable" data-opt="${encodeURIComponent(opt)}">${opt}</button>`).join('')}
        </div>
      </div>
    </div>
  `;
  document.getElementById('backHome').addEventListener('click', ()=>{ screen={name:'revise-landing'}; render(); });

  let answered = false;
  const wrap = document.getElementById('quizWrap');
  wrap.querySelectorAll('.option-btn').forEach(btn=>{
    btn.addEventListener('click', ()=>{
      if(answered) return;
      answered = true;
      const chosen = decodeURIComponent(btn.dataset.opt);
      const isCorrect = chosen === q.correct;
      wrap.querySelectorAll('.option-btn').forEach(b=>{
        const val = decodeURIComponent(b.dataset.opt);
        if(val === q.correct) b.classList.add('correct');
        else if(b === btn) b.classList.add('wrong');
        else b.classList.add('dim');
        b.disabled = true;
      });
      srsRecordAnswer(key, isCorrect);
      st.seen++;
      if(isCorrect) st.correct++;
      else if(!st._requeued) st._requeued = {};
      if(!isCorrect){
        st._requeued = st._requeued || {};
        if(!st._requeued[key]){
          st._requeued[key] = true;
          const reinsertAt = Math.min(st.queue.length, st.pos + 4);
          st.queue.splice(reinsertAt, 0, key);
        }
      }
      setTimeout(()=>{ st.pos++; render(); }, 700);
    });
  });
}

function finishSrsSession(){
  const st = revState;
  const prevBadges = unlockedBadgeIds(progress);
  progress.srsSessionsCompleted = (progress.srsSessionsCompleted||0) + 1;
  const xp = st.correct * 8;
  grantXP(xp);
  bumpDaily('quiz', 1);
  const newBadges = badgeDiff(prevBadges, progress);
  celebrateNewBadges(newBadges);
  saveProgress();
  screen = { name:'srs-result', stats:{ correct: st.correct, seen: st.seen, xp }, newBadges };
  render();
}
